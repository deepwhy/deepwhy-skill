<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f7fc">
  <meta name="description" content="从一个问题出发，沿着一组有来源的追问探索知识。">
  <title>__ASKWHY_TITLE__</title>
  <style>
    :root {
      --ink: #232039;
      --ink-soft: #46415d;
      --muted: #77728b;
      --violet: #7055d9;
      --violet-dark: #5b42c1;
      --violet-soft: #eee9ff;
      --violet-pale: #f7f4ff;
      --line: #e7e2f1;
      --line-strong: #d9d2e9;
      --paper: #fff;
      --paper-soft: #fbfafe;
      --canvas: #f6f4fa;
      --green: #2f8b6d;
      --green-soft: #e5f5ee;
      --amber: #b7792d;
      --amber-soft: #fff2df;
      --shadow: 0 18px 50px rgba(49, 37, 91, .07);
      --shadow-soft: 0 8px 24px rgba(49, 37, 91, .06);
      --radius-xl: 28px;
      --radius-lg: 20px;
      --radius-md: 14px;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      background: var(--canvas);
    }

    body {
      margin: 0;
      min-width: 320px;
      color: var(--ink);
      background:
        radial-gradient(circle at 8% 2%, rgba(188, 169, 255, .2), transparent 24rem),
        radial-gradient(circle at 94% 22%, rgba(208, 246, 230, .24), transparent 22rem),
        var(--canvas);
      font-family: var(--font);
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
    }

    button {
      font: inherit;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    :focus-visible {
      outline: 3px solid rgba(112, 85, 217, .34);
      outline-offset: 3px;
    }

    .platform-sprite {
      position: absolute;
      width: 0;
      height: 0;
      overflow: hidden;
    }

    .skip-link {
      position: fixed;
      z-index: 100;
      top: 10px;
      left: 10px;
      padding: 10px 14px;
      border-radius: 10px;
      color: #fff;
      background: var(--ink);
      transform: translateY(-150%);
      transition: transform .18s ease;
    }

    .skip-link:focus {
      transform: translateY(0);
    }

    .site-shell {
      width: min(1440px, 100%);
      margin: 0 auto;
      padding: 22px 32px 38px;
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 18px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 11px;
      border-radius: 14px;
    }

    .brand-mark {
      display: grid;
      width: 42px;
      height: 42px;
      place-items: center;
      border-radius: 15px;
      color: #fff;
      background: linear-gradient(145deg, #8b73ed 0%, #5d43c4 100%);
      box-shadow: 0 9px 22px rgba(96, 70, 193, .24);
    }

    .brand-mark svg {
      width: 26px;
      height: 26px;
      overflow: visible;
    }

    .brand-name {
      display: block;
      font-size: 21px;
      font-weight: 800;
      line-height: 1.05;
      letter-spacing: -.55px;
    }

    .brand-tagline {
      display: block;
      margin-top: 5px;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: .35px;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .action-button {
      display: inline-flex;
      min-height: 42px;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 9px 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
      color: var(--ink-soft);
      background: rgba(255, 255, 255, .86);
      box-shadow: 0 5px 16px rgba(49, 37, 91, .04);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
    }

    .action-button:hover {
      border-color: var(--line-strong);
      box-shadow: var(--shadow-soft);
      transform: translateY(-1px);
    }

    .action-button.primary {
      border-color: var(--violet);
      color: #fff;
      background: var(--violet);
      box-shadow: 0 9px 22px rgba(112, 85, 217, .2);
    }

    .action-button svg {
      width: 16px;
      height: 16px;
      flex: 0 0 auto;
    }

    .hero {
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(520px, 680px);
      align-items: center;
      margin-bottom: 22px;
      border: 1px solid var(--line);
      border-radius: 30px;
      background:
        radial-gradient(circle at 88% 8%, rgba(188, 169, 255, .18), transparent 22rem),
        #fff;
      box-shadow: 0 24px 60px rgba(49, 37, 91, .075);
      overflow: hidden;
    }

    .hero-copy {
      position: relative;
      z-index: 2;
      display: flex;
      min-width: 0;
      flex-direction: column;
      justify-content: center;
      padding: 28px 24px 26px 32px;
    }

    .hero-category {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--violet-dark);
      font-size: 11.5px;
      font-weight: 760;
    }

    .hero-category::before {
      width: 28px;
      height: 2px;
      border-radius: 99px;
      background: currentColor;
      content: "";
    }

    .hero h1 {
      max-width: 760px;
      margin: 10px 0;
      font-size: clamp(32px, 3.7vw, 50px);
      font-weight: 820;
      line-height: 1.11;
      letter-spacing: -1.7px;
      text-wrap: balance;
    }

    .hero-summary {
      max-width: 680px;
      margin: 0;
      color: var(--ink-soft);
      font-size: 13.5px;
      line-height: 1.68;
    }

    .meta-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 16px;
    }

    .meta-pill {
      display: inline-flex;
      min-height: 29px;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: #686279;
      background: rgba(255, 255, 255, .74);
      font-size: 11px;
      white-space: nowrap;
    }

    .meta-pill.accent {
      border-color: #ddd5f6;
      color: var(--violet-dark);
      background: var(--violet-pale);
    }

    .hero-overview {
      position: relative;
      width: 100%;
      margin: 0;
      padding: 14px 20px;
      background: transparent;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .hero-overview img {
      display: block;
      width: 100%;
      height: auto;
      border: 0;
      border-radius: 0;
      aspect-ratio: 2.62;
      object-fit: contain;
      background: transparent;
    }

    .explorer-layout {
      display: grid;
      grid-template-columns: minmax(0, 1.7fr) minmax(330px, .88fr);
      align-items: start;
      gap: 20px;
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: var(--radius-xl);
      background: rgba(255, 255, 255, .94);
      box-shadow: var(--shadow);
    }

    .map-panel {
      min-width: 0;
      overflow: hidden;
    }

    .panel-heading {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
      padding: 22px 24px 16px;
    }

    .panel-heading h2 {
      margin: 0;
      font-size: 17px;
      font-weight: 800;
      letter-spacing: -.25px;
    }

    .panel-heading p {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 12px;
    }

    .mode-label {
      flex: 0 0 auto;
      padding: 6px 9px;
      border: 1px solid var(--line);
      border-radius: 9px;
      color: var(--muted);
      background: var(--paper-soft);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .25px;
      white-space: nowrap;
    }

    .map-stage {
      padding: 0 18px;
    }

    .question-map {
      --map-height: 570px;
      position: relative;
      height: var(--map-height);
      overflow: hidden;
      border: 1px solid #eeebf5;
      border-radius: 21px;
      background:
        radial-gradient(ellipse at 50% 50%, rgba(255, 255, 255, .98) 0 18%, rgba(251, 250, 255, .96) 55%, rgba(244, 240, 252, .92) 100%);
      isolation: isolate;
    }

    .question-map::before {
      position: absolute;
      inset: 0;
      z-index: -1;
      background-image: radial-gradient(rgba(174, 160, 217, .34) .8px, transparent .8px);
      background-size: 22px 22px;
      content: "";
      mask-image: radial-gradient(ellipse at center, #000 0 44%, transparent 86%);
    }

    .chain-map {
      height: auto;
      min-height: 0;
      overflow: visible;
      padding: 22px;
      background:
        radial-gradient(ellipse at 20% 0%, rgba(255, 255, 255, .98), transparent 46%),
        linear-gradient(160deg, rgba(250, 248, 255, .98), rgba(244, 240, 252, .93));
    }

    .chain-root {
      position: relative;
      z-index: 1;
      width: min(540px, calc(100% - 40px));
      margin: 0 auto;
      padding: 18px 20px;
      border-radius: 18px;
      color: #fff;
      background:
        radial-gradient(circle at 12% 0%, rgba(255, 255, 255, .2), transparent 40%),
        linear-gradient(145deg, #795ddd 0%, #5c42c2 100%);
      box-shadow: 0 16px 34px rgba(92, 66, 194, .24);
    }

    .chain-root-kicker {
      display: block;
      margin-bottom: 6px;
      color: rgba(255, 255, 255, .72);
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 1.2px;
    }

    .chain-root strong {
      display: block;
      font-size: 18px;
      line-height: 1.42;
      letter-spacing: -.2px;
    }

    .chain-root p {
      margin: 7px 0 0;
      color: rgba(255, 255, 255, .77);
      font-size: 10.5px;
      line-height: 1.6;
    }

    .why-chain {
      position: relative;
      display: grid;
      max-width: 760px;
      gap: 16px;
      margin: 22px auto 0;
      padding-left: 38px;
    }

    .why-chain::before {
      position: absolute;
      top: 0;
      bottom: 24px;
      left: 15px;
      width: 1px;
      background: linear-gradient(var(--violet), #d7cfee 82%, transparent);
      content: "";
    }

    .why-step {
      position: relative;
      display: block;
      width: 100%;
      padding: 14px 15px;
      border: 1px solid #e2dcf1;
      border-radius: 15px;
      color: var(--ink);
      background: rgba(255, 255, 255, .96);
      box-shadow: 0 8px 22px rgba(54, 39, 103, .06);
      text-align: left;
      cursor: pointer;
      transition:
        transform .18s ease,
        border-color .18s ease,
        box-shadow .18s ease,
        background .18s ease;
    }

    .why-step::before {
      position: absolute;
      top: 20px;
      left: -31px;
      display: grid;
      width: 16px;
      height: 16px;
      place-items: center;
      border: 3px solid #faf9fd;
      border-radius: 50%;
      background: #b9a9e7;
      box-shadow: 0 0 0 1px #d4c9ec;
      content: "";
    }

    .why-step:not(:last-child)::after {
      position: absolute;
      bottom: -16px;
      left: -28px;
      width: 12px;
      color: #a794e4;
      content: "↓";
      font-size: 10px;
      font-weight: 800;
      line-height: 16px;
      text-align: center;
    }

    .why-step:hover {
      border-color: #cfc3f0;
      box-shadow: 0 12px 28px rgba(54, 39, 103, .1);
      transform: translateY(-1px);
    }

    .why-step.is-active {
      border: 1.5px solid var(--violet);
      background: #fff;
      box-shadow:
        0 0 0 4px rgba(112, 85, 217, .08),
        0 13px 30px rgba(54, 39, 103, .11);
    }

    .why-step.is-active::before {
      background: var(--violet);
    }

    .why-step-head {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-wrap: wrap;
      margin-bottom: 7px;
    }

    .why-step-index {
      color: var(--violet-dark);
      font-size: 9px;
      font-weight: 850;
      letter-spacing: .5px;
    }

    .why-step-type,
    .why-step-label {
      padding: 3px 6px;
      border-radius: 999px;
      color: #6d6385;
      background: #f2eff8;
      font-size: 8.5px;
      font-weight: 700;
    }

    .why-step-label {
      color: #6850bd;
      background: var(--violet-soft);
    }

    .why-step strong {
      display: block;
      font-size: 13px;
      font-weight: 800;
      line-height: 1.55;
    }

    .why-step-answer {
      display: -webkit-box;
      overflow: hidden;
      margin-top: 6px;
      color: #686278;
      font-size: 10.5px;
      line-height: 1.65;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
    }

    .why-step.has-visual {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 108px;
      gap: 12px;
      align-items: center;
    }

    .why-step-copy {
      min-width: 0;
    }

    .why-step-visual {
      position: relative;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      border: 1px solid rgba(112, 85, 217, .12);
      border-radius: 10px;
      background: #f7f4ff;
    }

    .why-step-visual img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .visual-kind-badge {
      position: absolute;
      right: 5px;
      bottom: 5px;
      padding: 2px 5px;
      border-radius: 999px;
      color: #fff;
      background: rgba(43, 35, 72, .74);
      font-size: 7px;
      font-weight: 800;
      letter-spacing: .35px;
    }

    .detail-visual {
      margin: 0;
    }

    .visual-frame {
      position: relative;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      border: 1px solid #e5def2;
      border-radius: 13px;
      background: #f7f4ff;
    }

    .visual-frame > img,
    .visual-frame > video,
    .visual-frame > svg {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .visual-frame video {
      background: #f7f4ff;
    }

    .manim-caption {
      position: absolute;
      right: 10px;
      bottom: 10px;
      left: 10px;
      padding: 6px 8px;
      border-radius: 8px;
      color: #fff;
      background: rgba(30, 24, 50, .76);
      font-size: 9.5px;
      line-height: 1.45;
      text-align: center;
      pointer-events: none;
    }

    .manim-poster-overlay {
      position: absolute;
      inset: 0;
      display: grid;
      padding: 0;
      border: 0;
      place-items: center;
      background: transparent;
      cursor: pointer;
    }

    .manim-poster-overlay img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .manim-poster-play {
      position: relative;
      z-index: 1;
      padding: 8px 13px;
      border-radius: 999px;
      color: var(--ink);
      background: rgba(255, 255, 255, .94);
      box-shadow: 0 7px 18px rgba(34, 25, 60, .16);
      font-size: 10px;
      font-weight: 800;
    }

    .visual-caption {
      margin: 8px 1px 0;
      color: #716b80;
      font-size: 10px;
      line-height: 1.6;
    }

    .visual-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: 7px;
    }

    .visual-kind-label {
      color: var(--muted);
      font-size: 8.5px;
      font-weight: 700;
      letter-spacing: .3px;
    }

    .manim-replay {
      padding: 5px 8px;
      border: 1px solid #ddd5ef;
      border-radius: 8px;
      color: var(--violet-dark);
      background: #fff;
      font-size: 9px;
      font-weight: 750;
      cursor: pointer;
    }

    .manim-replay:hover {
      background: var(--violet-pale);
    }

    .visual-transcript {
      margin-top: 7px;
      color: var(--muted);
      font-size: 9.5px;
      line-height: 1.55;
    }

    .visual-transcript summary {
      color: var(--violet-dark);
      font-weight: 700;
      cursor: pointer;
    }

    .visual-transcript ol {
      padding: 7px 0 0 18px;
      margin: 0;
    }

    .detail-answer {
      padding: 12px 13px;
      border: 1px solid #e3daf9;
      border-radius: 12px;
      color: #443a5d;
      background: linear-gradient(145deg, #f8f5ff, #fff);
      font-size: 12px;
      font-weight: 650;
      line-height: 1.72;
    }

    .analogy-card {
      padding: 15px;
      border: 1px solid #cee8dd;
      border-radius: 14px;
      background:
        radial-gradient(circle at 100% 0%, rgba(126, 201, 170, .2), transparent 9rem),
        linear-gradient(145deg, #f4fbf7, #fff);
    }

    .analogy-visual {
      margin: 0 0 13px;
      padding: 8px;
      border: 1px solid #d9ebe3;
      border-radius: 12px;
      background: rgba(255, 255, 255, .86);
    }

    .analogy-visual .visual-frame {
      border-radius: 9px;
    }

    .analogy-visual .visual-caption,
    .analogy-visual .visual-toolbar {
      padding-inline: 4px;
    }

    .analogy-title {
      margin: 0 0 7px;
      color: #285d4b;
      font-size: 14px;
      font-weight: 850;
      line-height: 1.45;
      text-wrap: balance;
    }

    .analogy-scene {
      margin: 0;
      color: #52675f;
      font-size: 11px;
      line-height: 1.7;
    }

    .analogy-mappings {
      display: grid;
      gap: 7px;
      margin: 13px 0;
    }

    .analogy-mapping {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
      align-items: center;
      gap: 8px;
      padding: 8px 9px;
      border: 1px solid #e1efe9;
      border-radius: 10px;
      background: rgba(255, 255, 255, .82);
      font-size: 10px;
      line-height: 1.5;
    }

    .analogy-mapping strong {
      color: #2f6954;
      overflow-wrap: anywhere;
    }

    .analogy-arrow {
      color: #8ca99e;
      font-weight: 850;
    }

    .analogy-concept {
      color: #4d5660;
      overflow-wrap: anywhere;
    }

    .analogy-limit {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 8px;
      margin: 0;
      padding-top: 10px;
      border-top: 1px dashed #c9e1d7;
      color: #6a766f;
      font-size: 9.5px;
      line-height: 1.65;
    }

    .analogy-limit strong {
      color: #396c59;
      white-space: nowrap;
    }

    .chain-nav {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      padding-top: 4px;
    }

    .chain-nav-button {
      display: block;
      min-width: 0;
      padding: 10px 11px;
      border: 1px solid var(--line);
      border-radius: 11px;
      color: var(--ink-soft);
      background: var(--paper-soft);
      text-align: left;
      cursor: pointer;
    }

    .chain-nav-button.next {
      text-align: right;
    }

    .chain-nav-button:hover {
      border-color: #d7cdf4;
      background: var(--violet-pale);
    }

    .chain-nav.is-single .chain-nav-button:not([hidden]) {
      grid-column: 1 / -1;
      text-align: left;
    }

    .chain-nav + .detail-section {
      margin-top: 22px;
    }

    .chain-nav-button small {
      display: block;
      color: var(--muted);
      font-size: 8.5px;
      font-weight: 700;
      letter-spacing: .35px;
    }

    .chain-nav-button strong {
      display: block;
      overflow: hidden;
      margin-top: 3px;
      font-size: 10px;
      line-height: 1.45;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .map-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      padding: 13px 3px 0;
      color: var(--muted);
      font-size: 10px;
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .legend-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--violet);
    }

    .legend-dot.evidence {
      background: var(--green);
    }

    .legend-dot.history {
      background: var(--amber);
    }

    .detail-panel {
      position: sticky;
      top: 18px;
      max-height: calc(100vh - 36px);
      overflow: auto;
      overscroll-behavior: contain;
      scrollbar-width: thin;
      scrollbar-color: #d9d2e8 transparent;
    }

    .detail-head {
      padding: 23px 23px 20px;
      border-bottom: 1px solid var(--line);
      background:
        radial-gradient(circle at 90% 0%, rgba(188, 169, 255, .2), transparent 15rem),
        linear-gradient(145deg, #f8f5ff, #fff 72%);
    }

    .detail-kicker {
      color: var(--violet-dark);
      font-size: 10px;
      font-weight: 850;
      letter-spacing: 1px;
      text-transform: uppercase;

    .detail-title {

      font-weight: 800;

    .detail-summary {
      margin: 0;
      color: #645f73;
      font-size: 12px;
      line-height: 1.75;
    }

    .tag-list {

      flex-wrap: wrap;
      gap: 6px;
      margin-top: 13px;

      background: var(--amber-soft);

      padding: 19px 23px 23px;

    .detail-section {

      margin: 0 0 18px;

    }

    .detail-section:last-child {
      padding-bottom: 0;
      margin-bottom: 0;
      border-bottom: 0;
    }

    .section-heading {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 10px;
      font-size: 12px;
      font-weight: 800;
    }

    .section-mark {
      display: grid;
      width: 25px;
      height: 25px;
      place-items: center;
      border-radius: 8px;
      color: var(--violet-dark);
      background: var(--violet-soft);
      font-size: 9px;
      font-weight: 850;
      letter-spacing: -.2px;
    }

    .section-observation .section-mark {
      color: var(--green);
      background: var(--green-soft);
    }

    .section-video .section-mark {
      color: var(--amber);
      background: var(--amber-soft);
    }

    .detail-copy {
      margin: 0;
      color: #625d70;
      font-size: 12px;
      line-height: 1.8;
    }

    .fact-list,
    .experiment-steps,
    .evidence-list {
      padding: 0;
      margin: 0;
      list-style: none;
    }

    .fact-list {
      display: grid;
      gap: 8px;
    }

    .fact-list li {
      position: relative;
      padding-left: 14px;
      color: #625d70;
      font-size: 11.5px;
      line-height: 1.68;
    }

    .fact-list li::before {
      position: absolute;
      top: .62em;
      left: 0;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #a794e4;
      content: "";
    }

    .experiment-card {
      padding: 13px;
      border: 1px solid #dceee6;
      border-radius: 13px;
      background: #f7fcf9;
    }

    .experiment-title {
      margin: 0 0 9px;
      font-size: 12px;
      font-weight: 800;
    }

    .experiment-steps {
      display: grid;
      gap: 7px;
      counter-reset: step;
    }

    .experiment-steps li {
      position: relative;
      padding-left: 25px;
      color: #587067;
      font-size: 11px;
      line-height: 1.58;
      counter-increment: step;
    }

    .experiment-steps li::before {
      position: absolute;
      top: 1px;
      left: 0;
      display: grid;
      width: 17px;
      height: 17px;
      place-items: center;
      border-radius: 50%;
      color: #fff;
      background: var(--green);
      content: counter(step);
      font-size: 8px;
      font-weight: 800;
    }

    .video-list {
      display: grid;
      gap: 10px;
    }

    .video-player {
      overflow: hidden;
      border: 1px solid #e8e2f2;
      border-radius: 14px;
      background: #fff;
      box-shadow: 0 8px 24px rgba(39, 28, 77, .07);
    }

    .video-frame {
      position: relative;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      background: #171322;
    }

    .video-frame iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #171322;
    }

    .video-embed-fallback {
      display: grid;
      height: 100%;
      place-content: center;
      justify-items: center;
      gap: 8px;
      padding: 22px;
      color: #fff;
      background:

        #171322;
      text-align: center;
    }

    .video-embed-fallback .platform-logo svg {
      width: 46px;
      height: 34px;
    }

    .video-embed-message {
      max-width: 300px;
      margin: 0;
      color: rgba(255, 255, 255, .82);
      font-size: 10.5px;
      line-height: 1.6;
    }

    .video-embed-open {
      display: inline-flex;
      margin-top: 3px;
      padding: 7px 11px;
      border-radius: 999px;
      color: #171322;
      background: #fff;
      font-size: 10px;
      font-weight: 800;
    }

    .video-player-bar {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      gap: 9px;
      align-items: center;
      padding: 10px 11px;
    }

    .platform-logo {
      display: inline-grid;
      flex: 0 0 auto;
      place-items: center;
    }

    .platform-logo svg {
      display: block;
      width: 32px;
      height: 24px;
    }

    .platform-logo.compact svg {
      width: 25px;
      height: 19px;
    }

    .video-player-copy {
      min-width: 0;
    }

    .video-player-title {
      display: block;
      overflow: hidden;
      color: var(--ink-soft);
      font-size: 11px;
      font-weight: 750;
      line-height: 1.45;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .video-player-meta,
    .video-player-why {
      display: block;
      color: var(--muted);
      font-size: 9.5px;
      line-height: 1.5;
    }

    .video-player-meta {
      margin-top: 2px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .video-player-why {
      margin-top: 4px;
      color: #817a90;
    }

    .video-open {
      align-self: start;
      padding: 4px 0 2px;
      color: var(--violet-dark);
      font-size: 9.5px;
      font-weight: 750;
      white-space: nowrap;
    }

    .video-open:hover {
      color: var(--violet);
    }

    .video-alternatives {
      display: grid;
      gap: 6px;
      margin-top: 8px;
    }

    .video-choice {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 8px;
      align-items: center;
      width: 100%;
      padding: 8px 9px;
      border: 1px solid #ece7f4;
      border-radius: 10px;
      color: var(--ink-soft);
      background: var(--paper-soft);
      text-align: left;
      cursor: pointer;
      transition: border-color .18s ease, background .18s ease;
    }

    .video-choice:hover {
      border-color: #d8cff4;
      background: var(--violet-pale);
    }

    .video-choice[aria-pressed="true"] {
      border-color: var(--violet);
      background: var(--violet-pale);
      box-shadow: 0 0 0 2px rgba(112, 85, 217, .07);
    }

    .video-choice-title {
      display: block;
      overflow: hidden;
      font-size: 10.5px;
      font-weight: 700;
      line-height: 1.45;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .resource-title {
      display: block;
      color: var(--ink-soft);
      font-size: 11px;
      font-weight: 750;
      line-height: 1.45;
    }

    .resource-meta {
      display: block;
      margin-top: 3px;
      overflow: hidden;
      color: var(--muted);
      font-size: 9.5px;
      line-height: 1.45;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .resource-why {
      display: block;
      margin-top: 4px;
      color: #817a90;
      font-size: 9.5px;
      line-height: 1.5;
    }

    .evidence-gaps {
      padding: 11px 12px;
      border: 1px solid #f0e2cc;
      border-radius: 12px;
      background: #fffaf2;
    }

    .evidence-list {
      display: grid;
      gap: 6px;
    }

    .evidence-list li {
      position: relative;
      padding-left: 12px;
      color: #7b6542;
      font-size: 10.5px;
      line-height: 1.58;
    }

    .evidence-list li::before {
      position: absolute;
      top: .66em;
      left: 0;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--amber);
      content: "";
    }

    .footer {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 22px;
      margin-top: 22px;
      padding: 0 5px;
      color: var(--muted);
      font-size: 10.5px;
      line-height: 1.65;
    }

    .footer strong {
      color: var(--violet-dark);
    }

    .footer-note {
      max-width: 620px;
      text-align: right;
    }

    .toast {
      position: fixed;
      z-index: 50;
      bottom: 24px;
      left: 50%;
      max-width: min(420px, calc(100vw - 30px));
      padding: 11px 15px;
      border-radius: 12px;
      color: #fff;
      background: #28233d;
      box-shadow: 0 12px 30px rgba(28, 21, 49, .24);
      font-size: 11.5px;
      line-height: 1.45;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 14px);
      transition: opacity .2s ease, transform .2s ease;
    }

    .toast.is-visible {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    [hidden] {
      display: none !important;
    }

    @media (max-width: 1080px) {
      .site-shell {
        padding-inline: 22px;
      }

      .hero {
        grid-template-columns: minmax(0, 1fr) minmax(440px, 540px);
      }

      .hero-copy {
        padding: 24px 18px 22px 24px;
      }

      .hero-overview {
        padding: 12px 16px;
      }

      .explorer-layout {
        grid-template-columns: minmax(0, 1.5fr) minmax(310px, .86fr);
      }

      .map-stage {
        padding-inline: 14px;
      }

    }

    @media (max-width: 900px) {
      .hero {
        grid-template-columns: minmax(0, 1fr);
      }

      .hero-copy {
        padding-bottom: 12px;
      }

      .hero-overview {
        width: 100%;
        padding: 14px;
      }

      .hero-overview img {
        max-width: 420px;
        margin-inline: auto;
      }

      .explorer-layout {
        grid-template-columns: 1fr;
      }

      .detail-panel {
        position: relative;
        top: auto;
        max-height: none;
      }
    }

    @media (max-width: 760px) {
      html {
        scroll-behavior: auto;
      }

      .site-shell {
        padding: 16px 12px 28px;
      }

      .topbar {
        margin-bottom: 16px;
      }

      .brand-mark {
        width: 38px;
        height: 38px;
        border-radius: 13px;
      }

      .brand-name {
        font-size: 19px;
      }

      .brand-tagline {
        font-size: 9.5px;
      }

      .action-button {
        width: 40px;
        min-height: 40px;
        padding: 9px;
      }

      .action-label {
        display: none;
      }

      .hero {
        margin-bottom: 22px;
        border-radius: 22px;
      }

      .hero h1 {
        margin: 8px 0;
        font-size: clamp(24px, 7.2vw, 30px);
        letter-spacing: -1.05px;
      }

      .hero-summary {
        font-size: 13px;
      }

      .hero-copy {
        padding: 18px 18px 16px;
      }

      .meta-pills {
        margin-top: 12px;
      }

      .meta-pill {
        min-height: 27px;
        padding: 4px 8px;
        font-size: 9.5px;
      }

      .hero-overview {
        width: 100%;
        padding: 10px;
        border-top: 1px solid var(--line);
        border-left: 0;
      }

      .panel {
        border-radius: 22px;
      }

      .panel-heading {
        padding: 18px 16px 12px;
      }

      .mode-label {
        display: none;
      }

      .map-stage {
        padding: 0 10px;
      }

      .question-map {
        display: flex;
        height: auto;
        min-height: 0;
        flex-direction: column;
        gap: 10px;
        padding: 16px 12px 16px 42px;
        overflow: visible;
        background:
          linear-gradient(90deg, rgba(246, 243, 255, .82), rgba(255, 255, 255, .94) 40%),
          var(--paper-soft);
      }

      .question-map::before {
        background-size: 18px 18px;
        mask-image: linear-gradient(90deg, transparent, #000 35%, transparent);
      }

      .chain-map {
        display: block;
        padding: 14px 10px 16px;
        background:
          linear-gradient(90deg, rgba(246, 243, 255, .82), rgba(255, 255, 255, .94) 40%),
          var(--paper-soft);
      }

      .chain-root {
        width: 100%;
        padding: 15px 16px;
      }

      .chain-root strong {
        font-size: 16px;
      }

      .why-chain {
        gap: 13px;
        margin-top: 18px;
        padding-left: 29px;
      }

      .why-chain::before {
        left: 10px;
      }

      .why-step {
        padding: 12px 12px;
      }

      .why-step.has-visual {
        grid-template-columns: minmax(0, 1fr) 82px;
        gap: 8px;
      }

      .why-step::before {
        left: -25px;
      }

      .why-step strong {
        font-size: 12px;
      }

      .why-step-answer {
        font-size: 10px;
      }

      .chain-nav {
        grid-template-columns: 1fr;
      }

      .chain-nav-button.next {
        text-align: left;
      }

      .map-legend {
        padding: 11px 5px 0;
      }

      .detail-head {
        padding: 20px 17px 17px;
      }

      .detail-title {
        font-size: 21px;
      }

      .detail-body {
        padding: 17px;
      }

      .footer {
        flex-direction: column;
        gap: 7px;
        padding-inline: 4px;
      }

      .footer-note {
        max-width: none;
        text-align: left;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>

            </section>
            <section class="detail-section section-video" id="videos-section" hidden>
              <h3 class="section-heading"><span class="section-mark">PLAY</span>视频讲解</h3>
              <div class="video-list" id="detail-videos"></div>
            </section>
            <section class="detail-section">
              <h3 class="section-heading"><span class="section-mark">NOTE</span>证据边界</h3>
              <div class="evidence-gaps">
                <ul class="evidence-list" id="evidence-gaps"></ul>
              </div>
            </section>
          </div>
        </aside>
      </section>
    </main>

    <footer class="footer">
      <span><strong>AskWhy</strong> · 让下一问成为进入知识的入口</span>
      <span class="footer-note">页面用于知识导览；事实、外链与视频在发布前均应核验。</span>
    </footer>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script type="application/json" id="askwhy-data">__ASKWHY_DATA__</script>
  <script>
    (() => {
      "use strict";

      const data = JSON.parse(document.getElementById("askwhy-data").textContent);
      const center = { ...data.center, facts: [], experiment: null, videoLinks: [] };
      const nodes = [center, ...data.nodes];
      const nodeById = new Map(nodes.map(node => [node.id, node]));
      const detailPanel = document.getElementById("detail-panel");
      const desktopQuery = window.matchMedia("(min-width: 761px)");
      const LEARNING_LEVEL_LABELS = {
        primary: "小学",
        middle: "初中",
        high: "高中"
      };
      const NODE_TYPE_LABELS = {
        phenomenon: "现象",
        mechanism: "机制",
        principle: "原理",
        evidence: "证据",
        foundation: "基础",
        boundary: "边界"
      };
      let selectedId = "root";
      let toastTimer = 0;

      const setText = (id, value) => {
        document.getElementById(id).textContent = value;
      };

      const create = (tag, className, text) => {
        const element = document.createElement(tag);
        if (className) element.className = className;
        if (text !== undefined) element.textContent = text;
        return element;
      };

      function hashId() {
        const match = window.location.hash.match(/^#question-([a-z0-9-]+)$/);
        return match && nodeById.has(match[1]) ? match[1] : null;
      }

      function questionHash(id) {
        return `#question-${id}`;
      }

      function populateHero() {
        document.documentElement.lang = data.meta.language || "zh-CN";
        setText("hero-question", data.meta.question);
        setText("hero-summary", center.summary || data.meta.summary);
        const overview = center.overviewVisual;
        const overviewFigure = document.getElementById("hero-overview");
        const overviewImage = document.getElementById("hero-overview-image");
        overviewFigure.hidden = !overview;
        if (overview) {
          overviewImage.src = overview.src;
          overviewImage.alt = overview.alt;
          setText("hero-overview-caption", overview.caption);
        }
        const learningLevelLabel =
          LEARNING_LEVEL_LABELS[data.meta.learningLevel] || data.meta.learningLevel;
        setText(
          "hero-category",
          [data.meta.category, learningLevelLabel ? `${learningLevelLabel}版` : null]
            .filter(Boolean)
            .join(" · ")
        );
        const pills = [
          ["预计探索 " + data.meta.estimatedMinutes + " 分钟", true],
          [data.nodes.length + " 层追问", false],
          ["从现象抵达根基", false]
        ].filter(Boolean);
        const container = document.getElementById("meta-pills");
        container.replaceChildren();
        pills.forEach(([label, accent]) => {
          container.append(create("span", "meta-pill" + (accent ? " accent" : ""), label));
        });
      }

      function buildChain() {
        setText("chain-root-question", center.question);
        setText("chain-root-summary", center.summary);
        const chain = document.getElementById("why-chain");
        chain.replaceChildren();
        nodes.slice(1).forEach((node, index) => {
          const button = create(
            "button",
            "why-step"
          );
          button.type = "button";
          button.id = `question-${node.id}`;
          button.dataset.nodeId = node.id;
          button.setAttribute("aria-controls", "detail-panel");
          button.setAttribute("aria-pressed", "false");

          const head = create("span", "why-step-head");
          head.append(
            create("span", "why-step-index", `WHY ${String(index + 1).padStart(2, "0")}`),
            create(
              "span",
              "why-step-type",
              NODE_TYPE_LABELS[node.type] || node.type
            ),
            create("span", "why-step-label", node.label)
          );
          const copy = create("span", "why-step-copy");
          copy.append(
            head,
            create("strong", "", node.question),
            create("span", "why-step-answer", node.answer)
          );
          button.append(copy);
          if (node.visual) {
            button.classList.add("has-visual");
            const preview = create("span", "why-step-visual");
            const image = document.createElement("img");
            image.src = visualPreviewSource(node.visual);
            image.alt = "";
            preview.append(
              image,
              create(
                "span",
                "visual-kind-badge",
                node.visual.kind === "manim" ? "ANIM" : "FIG"
              )
            );
            button.append(preview);
          }
          button.addEventListener("click", () => selectNode(node.id, { updateUrl: true }));
          chain.append(button);
        });
      }

      function renderTags(container, tags) {
        container.replaceChildren();
        tags.forEach(tag => container.append(create("span", "tag", tag)));
      }

      function renderAnalogy(analogy) {
        const section = document.getElementById("analogy-section");
        const mappings = document.getElementById("analogy-mappings");
        section.hidden = !analogy;
        mappings.replaceChildren();
        if (!analogy) return;

        renderFigureVisual(
          document.getElementById("analogy-visual"),
          analogy.visual || null,
          {
            compact: true,
            imageLabel: "类比示意图",
            manimLabel: "类比动画"
          }
        );
        setText("analogy-title", analogy.title);
        setText("analogy-scene", analogy.scene);
        setText("analogy-limit", analogy.limit);
        analogy.mappings.forEach(mapping => {
          const row = create("div", "analogy-mapping");
          row.append(
            create("strong", "", mapping.familiar),
            create("span", "analogy-arrow", "→"),
            create("span", "analogy-concept", mapping.concept)
          );
          mappings.append(row);
        });
      }

      const PLATFORM_LABELS = {
        bilibili: "Bilibili",
        youtube: "YouTube"
      };

      function platformLogo(platform, compact = false) {
        const wrapper = create(
          "span",
          "platform-logo" + (compact ? " compact" : "")
        );
        wrapper.dataset.platform = platform;
        wrapper.setAttribute("role", "img");
        wrapper.setAttribute("aria-label", PLATFORM_LABELS[platform] || platform);
        const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        svg.setAttribute("viewBox", "0 0 40 28");
        svg.setAttribute("aria-hidden", "true");
        const use = document.createElementNS("http://www.w3.org/2000/svg", "use");
        use.setAttribute("href", `#platform-logo-${platform}`);
        svg.append(use);
        wrapper.append(svg);
        return wrapper;
      }

      function formatDuration(seconds) {
        if (!Number.isInteger(seconds)) return null;
        const minutes = Math.floor(seconds / 60);
        return `${minutes}:${String(seconds % 60).padStart(2, "0")}`;
      }

      function renderVideos(videos) {
        const section = document.getElementById("videos-section");
        const list = document.getElementById("detail-videos");
        list.replaceChildren();
        section.hidden = videos.length === 0;
        if (videos.length === 0) return;

        const player = create("div", "video-player");
        const frame = create("div", "video-frame");
        const iframe = document.createElement("iframe");
        iframe.className = "video-iframe";
        iframe.loading = "lazy";
        iframe.referrerPolicy = "strict-origin-when-cross-origin";
        iframe.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";
        iframe.allowFullscreen = true;
        const embedFallback = create("div", "video-embed-fallback");
        embedFallback.hidden = true;
        frame.append(iframe, embedFallback);

        const bar = create("div", "video-player-bar");
        const logoMount = create("span", "video-logo-mount");
        const copy = create("span", "video-player-copy");
        const title = create("span", "video-player-title");
        const metadata = create("span", "video-player-meta");
        const rationale = create("span", "video-player-why");
        const open = create("a", "video-open", "打开视频 ↗");
        open.target = "_blank";
        open.rel = "noopener noreferrer";
        copy.append(title, metadata, rationale);
        bar.append(logoMount, copy, open);
        player.append(frame, bar);

        const buttons = videos.map((video, index) => {
          const button = create("button", "video-choice");
          button.type = "button";
          button.dataset.platform = video.platform;
          button.append(platformLogo(video.platform, true));
          const buttonCopy = create("span");
          buttonCopy.append(create("span", "video-choice-title", video.title));
          const duration = formatDuration(video.durationSeconds);
          buttonCopy.append(
            create(
              "span",
              "resource-meta",
              [PLATFORM_LABELS[video.platform] || video.platform, duration]
                .filter(Boolean)
                .join(" · ")
            )
          );
          button.append(buttonCopy);
          button.addEventListener("click", () => activate(index));
          return button;
        });

        function activate(index) {
          const video = videos[index];
          const label = PLATFORM_LABELS[video.platform] || video.platform;
          const localYoutube =
            video.platform === "youtube" && window.location.protocol === "file:";
          if (localYoutube) {
            iframe.removeAttribute("src");
            iframe.hidden = true;
            embedFallback.replaceChildren(
              platformLogo("youtube"),
              create(
                "p",
                "video-embed-message",
                "YouTube 播放器要求 HTTP 页面来源。直接打开本地 HTML 时无法内嵌；通过静态服务器打开页面即可播放，也可先前往 YouTube。"
              )
            );
            const fallbackLink = create("a", "video-embed-open", "前往 YouTube ↗");
            fallbackLink.href = video.url;
            fallbackLink.target = "_blank";
            fallbackLink.rel = "noopener noreferrer";
            embedFallback.append(fallbackLink);
            embedFallback.hidden = false;
          } else {
            embedFallback.hidden = true;
            iframe.hidden = false;
            iframe.src = video.embedUrl;
            iframe.title = `${label} 视频：${video.title}`;
          }
          logoMount.replaceChildren(platformLogo(video.platform));
          title.textContent = video.title;
          const duration = formatDuration(video.durationSeconds);
          metadata.textContent = [
            video.author,
            duration,
            `${label} · 页面内播放`
          ].filter(Boolean).join(" · ");
          rationale.textContent = video.selectionRationale || "";
          rationale.hidden = !video.selectionRationale;
          open.href = video.url;
          open.title = `在 ${label} 打开原视频`;
          buttons.forEach((button, buttonIndex) => {
            button.setAttribute("aria-pressed", String(buttonIndex === index));
          });
        }

        list.append(player);
        if (videos.length > 1) {
          const alternatives = create("div", "video-alternatives");
          buttons.forEach(button => alternatives.append(button));
          list.append(alternatives);
        }
        activate(0);
      }

      function visualPreviewSource(visual) {
        return visual.kind === "manim" ? visual.posterSrc : visual.src;
      }

      function renderFigureVisual(figure, visual, options = {}) {
        figure.querySelectorAll("video").forEach(video => video.pause());
        figure.replaceChildren();
        figure.hidden = !visual;
        if (!visual) return;

        const {
          compact = false,
          captionOverride = null,
          imageLabel = "静态机制图",
          manimLabel = "MANIM 动画"
        } = options;
        const frame = create("div", "visual-frame");
        if (visual.kind === "image") {
          const image = document.createElement("img");
          image.src = visual.src;
          image.alt = visual.alt;
          frame.append(image);
          const toolbar = create("div", "visual-toolbar");
          toolbar.append(create("span", "visual-kind-label", imageLabel));
          figure.append(
            frame,
            create("figcaption", "visual-caption", captionOverride || visual.caption),
            toolbar
          );
          return;
        }

        const video = document.createElement("video");
        video.muted = true;
        video.loop = true;
        video.playsInline = true;
        video.preload = "metadata";
        video.controls = true;
        video.setAttribute("aria-label", visual.alt);
        const source = document.createElement("source");
        source.src = visual.videoSrc;
        source.type = "video/webm";
        video.append(source);
        const caption = create("div", "manim-caption", "");
        const posterOverlay = create("button", "manim-poster-overlay");
        posterOverlay.type = "button";
        const posterImage = document.createElement("img");
        posterImage.src = visual.posterSrc;
        posterImage.alt = "";
        posterOverlay.append(
          posterImage,
          create("span", "manim-poster-play", "播放动画")
        );
        posterOverlay.addEventListener("click", () => {
          video.play().catch(() => {});
        });
        frame.append(video, posterOverlay, caption);

        const fallback = document.createElement("img");
        fallback.className = "visual-fallback";
        fallback.hidden = true;
        fallback.alt = visual.alt;
        fallback.src = `data:image/svg+xml;charset=utf-8,${encodeURIComponent(visual.fallbackSvg)}`;
        frame.append(fallback);

        const toolbar = create("div", "visual-toolbar");
        toolbar.append(
          create(
            "span",
            "visual-kind-label",
            `${manimLabel} · ${Number(visual.durationSeconds).toFixed(1)} 秒`
          )
        );
        const replay = create("button", "manim-replay", "重播");
        replay.type = "button";
        replay.addEventListener("click", () => {
          posterOverlay.hidden = false;
          video.currentTime = 0;
          video.play().catch(() => {});
        });
        toolbar.append(replay);

        const transcript = document.createElement("details");
        transcript.className = "visual-transcript";
        transcript.append(create("summary", "", "文字说明"));
        const cues = document.createElement("ol");
        visual.transcript.forEach(cue => cues.append(create("li", "", cue.text)));
        transcript.append(cues);

        video.addEventListener("timeupdate", () => {
          const cue = visual.transcript.find(
            item => video.currentTime >= item.start && video.currentTime < item.end
          );
          caption.textContent = cue ? cue.text : "";
          caption.hidden = !cue;
          if (video.currentTime >= 0.1) {
            posterOverlay.hidden = true;
          }
        });
        video.addEventListener("error", () => {
          video.hidden = true;
          posterOverlay.hidden = true;
          caption.hidden = true;
          fallback.hidden = false;
        });

        figure.append(
          frame,
          create("figcaption", "visual-caption", captionOverride || visual.caption),
          toolbar,
          transcript
        );
        const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        replay.textContent = reducedMotion ? "播放动画" : "重播";
        if (!reducedMotion) {
          video.play().catch(() => {});
        }
      }

      function renderVisual(visual, captionOverride = null) {
        const section = document.getElementById("visual-section");
        const figure = document.getElementById("detail-visual");
        section.hidden = !visual;
        renderFigureVisual(
          figure,
          visual,
          captionOverride ? { captionOverride } : {}
        );
      }

      function renderExperiment(experiment) {
        const section = document.getElementById("experiment-section");
        section.hidden = !experiment;
        if (!experiment) return;
        setText("experiment-title", experiment.title);
        const list = document.getElementById("experiment-steps");
        list.replaceChildren();
        experiment.steps.forEach(step => list.append(create("li", "", step)));
      }

      function renderEvidenceGaps() {
        const list = document.getElementById("evidence-gaps");
        list.replaceChildren();
        const gaps = data.meta.evidenceGaps.length
          ? data.meta.evidenceGaps
          : ["当前内容未声明额外证据边界；外链仍需在发布前核验。"];
        gaps.forEach(gap => list.append(create("li", "", gap)));
      }

      function renderActiveButton() {
        document.querySelectorAll(".why-step").forEach(button => {
          const active = button.dataset.nodeId === selectedId;
          button.classList.toggle("is-active", active);
          button.setAttribute("aria-pressed", String(active));
        });
      }

      function renderChainNav(node, index) {
        const previous = document.getElementById("previous-question");
        const next = document.getElementById("next-question");
        const previousNode = index > 0 ? nodes[index - 1] : null;
        const nextNode = index < nodes.length - 1 ? nodes[index + 1] : null;
        const nav = previous.closest(".chain-nav");

        previous.hidden = !previousNode;
        if (previousNode) {
          previous.querySelector("strong").textContent = previousNode.question;
          previous.dataset.nodeId = previousNode.id;
        }

        next.hidden = !nextNode;
        if (nextNode) {
          next.querySelector("strong").textContent = nextNode.question;
          next.dataset.nodeId = nextNode.id;
        }
        nav.classList.toggle("is-single", !previousNode || !nextNode);
      }

      function renderDetail() {
        const node = nodeById.get(selectedId) || center;
        const index = nodes.findIndex(item => item.id === node.id);
        setText(
          "detail-kicker",
          node.id === "root"
            ? "中心问题 · 从现象出发"
            : `第 ${String(index).padStart(2, "0")} 层 / ${String(data.nodes.length).padStart(2, "0")} · ${NODE_TYPE_LABELS[node.type] || node.type} · ${node.label}`
        );
        setText("detail-title", node.question);
        setText("detail-summary", node.summary);
        renderTags(document.getElementById("detail-tags"), node.tags);
        renderVisual(node.visual || null, node.visualCaption || null);
        const answerSection = document.getElementById("answer-section");
        answerSection.hidden = node.id === "root";
        setText("detail-answer", node.answer || "");
        renderAnalogy(node.analogy || null);
        setText("knowledge-heading", node.id === "root" ? "中心洞察" : "核心知识");
        const knowledge = node.id === "root" ? node.insight : node.knowledge;
        document.getElementById("knowledge-section").hidden = !knowledge;
        setText("detail-knowledge", knowledge || "");

        const facts = node.facts || [];
        const factsSection = document.getElementById("facts-section");
        factsSection.hidden = facts.length === 0;
        const factsList = document.getElementById("detail-facts");
        factsList.replaceChildren();
        facts.forEach(fact => factsList.append(create("li", "", fact)));

        renderExperiment(node.experiment);
        renderVideos(node.videoLinks || []);
        renderChainNav(node, index);
        renderActiveButton();
      }

      function selectNode(id, options = {}) {
        if (!nodeById.has(id)) return;
        selectedId = id;
        renderDetail();
        if (options.updateUrl) {
          const nextHash = questionHash(id);
          if (window.location.hash !== nextHash) {
            window.history.pushState({ questionId: id }, "", nextHash);
          }
        }
        if (options.updateUrl && !desktopQuery.matches) {
          window.requestAnimationFrame(() => {
            detailPanel.scrollIntoView({ block: "start" });
          });
        }
      }

      async function copyText(text) {
        try {
          await navigator.clipboard.writeText(text);
          return true;
        } catch (error) {
          const area = document.createElement("textarea");
          area.value = text;
          area.setAttribute("readonly", "");
          area.style.position = "fixed";
          area.style.opacity = "0";
          document.body.append(area);
          area.select();
          let copied = false;
          try {
            copied = document.execCommand("copy");
          } catch (fallbackError) {
            copied = false;
          }
          area.remove();
          return copied;
        }
      }

      function showToast(message) {
        const toast = document.getElementById("toast");
        window.clearTimeout(toastTimer);
        toast.textContent = message;
        toast.classList.add("is-visible");
        toastTimer = window.setTimeout(() => toast.classList.remove("is-visible"), 2300);
      }

      document.getElementById("previous-question").addEventListener("click", event => {
        const nodeId = event.currentTarget.dataset.nodeId;
        if (nodeId) selectNode(nodeId, { updateUrl: true });
      });

      document.getElementById("next-question").addEventListener("click", event => {
        const nodeId = event.currentTarget.dataset.nodeId;
        if (nodeId) selectNode(nodeId, { updateUrl: true });
      });

      document.getElementById("copy-question").addEventListener("click", async () => {
        const question = (nodeById.get(selectedId) || center).question;
        const copied = await copyText(question);
        showToast(copied ? `已复制：${question}` : question);
      });

      document.getElementById("share-link").addEventListener("click", async () => {
        if (window.location.hash !== questionHash(selectedId)) {
          const url = new URL(window.location.href);
          url.hash = questionHash(selectedId);
          window.history.replaceState(
            { questionId: selectedId },
            "",
            `${url.pathname}${url.search}${url.hash}`
          );
        }
        const url = window.location.href;
        if (navigator.share && window.location.protocol !== "file:") {
          try {
            await navigator.share({
              title: document.title,
              text: data.center.question,
              url
            });
            return;
          } catch (error) {
            if (error && error.name === "AbortError") return;
          }
        }
        const copied = await copyText(url);
        showToast(copied ? "当前问题的分享链接已复制" : "可从浏览器地址栏复制当前链接");
      });

      window.addEventListener("popstate", () => {
        selectNode(hashId() || "root");
      });

      window.addEventListener("hashchange", () => {
        selectNode(hashId() || "root");
      });

      populateHero();
      buildChain();
      renderEvidenceGaps();
      selectedId = hashId() || "root";
      renderDetail();
    })();
  </script>
</body>
</html>
