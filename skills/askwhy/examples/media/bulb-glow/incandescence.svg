<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="title desc">
  <title id="title">白炽灯的电能、热与可见光</title>
  <desc id="desc">电流加热灯丝，灯丝发出热辐射，其中一部分进入可见光波段。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfaff"/>
      <stop offset="1" stop-color="#eee9ff"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#ffd37a" stop-opacity=".9"/>
      <stop offset=".42" stop-color="#ff9d4d" stop-opacity=".38"/>
      <stop offset="1" stop-color="#ff8a3d" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#7055d9"/>
    </marker>
  </defs>
  <rect width="800" height="450" rx="28" fill="url(#bg)"/>
  <text x="52" y="66" fill="#26213a" font-family="PingFang SC, sans-serif" font-size="28" font-weight="750">白炽灯：电能先变成热，再变成光</text>
  <text x="52" y="94" fill="#77718b" font-family="PingFang SC, sans-serif" font-size="14">可见光不是电流直接“冲出来”的，而是高温热辐射的一部分。</text>

  <g transform="translate(88 130)">
    <rect x="0" y="0" width="240" height="218" rx="24" fill="#fff" stroke="#e2dcf2"/>
    <path d="M92 168h56M100 180h40" stroke="#9b91b7" stroke-width="7" stroke-linecap="round"/>
    <path d="M88 168c-30-18-43-45-43-77a75 75 0 1 1 150 0c0 32-13 59-43 77" fill="#fff" stroke="#bbb2cf" stroke-width="5"/>
    <path d="M78 94c10-18 18 18 30 0s18 18 30 0 18 18 30 0" fill="none" stroke="#ff9e45" stroke-width="6" stroke-linecap="round"/>
    <circle cx="126" cy="91" r="82" fill="url(#glow)" filter="url(#soft)"/>
    <rect x="38" y="196" width="164" height="28" rx="14" fill="#f1edff"/>
    <text x="120" y="215" text-anchor="middle" fill="#5b42c1" font-family="PingFang SC, sans-serif" font-size="12" font-weight="700">钨丝温度升高</text>
  </g>

  <g transform="translate(395 145)">
    <rect x="0" y="0" width="320" height="76" rx="18" fill="#fff" stroke="#e5dff3"/>
    <text x="20" y="30" fill="#322d48" font-family="PingFang SC, sans-serif" font-size="17" font-weight="750">电流做功</text>
    <text x="20" y="53" fill="#77718b" font-family="PingFang SC, sans-serif" font-size="13">电子与晶格碰撞，产生焦耳热</text>
    <path d="M125 38h54" stroke="#7055d9" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="196" y="30" fill="#322d48" font-family="PingFang SC, sans-serif" font-size="17" font-weight="750">热辐射</text>
    <text x="196" y="53" fill="#77718b" font-family="PingFang SC, sans-serif" font-size="13">温度越高，谱峰越靠短波</text>
  </g>

  <g transform="translate(395 246)">
    <rect x="0" y="0" width="320" height="108" rx="18" fill="#252039"/>
    <text x="18" y="29" fill="#fff" font-family="PingFang SC, sans-serif" font-size="12" font-weight="700">一部分热辐射进入可见波段</text>
    <rect x="18" y="45" width="284" height="18" rx="9" fill="none" stroke="#ffffff45"/>
    <rect x="18" y="45" width="42" height="18" rx="9" fill="#ff4d6d"/>
    <rect x="60" y="45" width="42" height="18" fill="#ff9c47"/>
    <rect x="102" y="45" width="42" height="18" fill="#ffe45f"/>
    <rect x="144" y="45" width="42" height="18" fill="#66d18b"/>
    <rect x="186" y="45" width="42" height="18" fill="#55a6ff"/>
    <rect x="228" y="45" width="42" height="18" fill="#8b6df0"/>
    <rect x="270" y="45" width="32" height="18" rx="9" fill="#c76ae7"/>
    <text x="18" y="91" fill="#ffffff99" font-family="PingFang SC, sans-serif" font-size="11">人眼只看到 380–750 nm 的狭窄区间</text>
  </g>

  <g transform="translate(88 385)">
    <rect width="628" height="34" rx="17" fill="#ffffffcc" stroke="#e4def2"/>
    <text x="314" y="22" text-anchor="middle" fill="#5c556d" font-family="PingFang SC, sans-serif" font-size="13">
      电能 → 内能 / 热 → 热辐射 → 其中一小部分成为可见光
    </text>
  </g>
</svg>
