<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="title desc">
  <title id="title">化学自由能驱动电池</title>
  <desc id="desc">反应物具有较高吉布斯自由能，反应后降低；自由能差可转换为电池做的电功。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfaff"/>
      <stop offset="1" stop-color="#f0ecff"/>
    </linearGradient>
    <marker id="down" viewBox="0 0 10 10" refX="5" refY="9" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0h10L5 10Z" fill="#2f8b6d"/>
    </marker>
  </defs>
  <rect width="800" height="450" rx="28" fill="url(#bg)"/>
  <text x="52" y="66" fill="#26213a" font-family="PingFang SC, sans-serif" font-size="28" font-weight="750">自由能下降，驱动电子转移</text>
  <text x="52" y="94" fill="#77718b" font-family="PingFang SC, sans-serif" font-size="14">电池能持续分离电荷，是因为反应体系具有可释放的化学自由能。</text>

  <g transform="translate(68 126)">
    <rect width="664" height="268" rx="24" fill="#fff" stroke="#e2dcf2"/>
    <path d="M76 220H604M76 220V38" stroke="#bbb3ca" stroke-width="1.5"/>
    <path d="M76 88C126 80 154 68 194 76c38 8 49 108 90 113 35 4 78-14 128-15 39-1 82-9 192-14" fill="none" stroke="#7055d9" stroke-width="4"/>
    <path d="M200 76v144M200 145h310" stroke="#2f8b6d" stroke-width="2.5" marker-end="url(#down)"/>
    <text x="94" y="76" fill="#5b42c1" font-family="PingFang SC, sans-serif" font-size="13" font-weight="700">反应物：G 较高</text>
    <text x="574" y="170" text-anchor="end" fill="#5b42c1" font-family="PingFang SC, sans-serif" font-size="13" font-weight="700">产物：G 较低</text>
    <text x="362" y="164" text-anchor="middle" fill="#2f8b6d" font-family="PingFang SC, sans-serif" font-size="13">ΔG &lt; 0</text>
    <text x="604" y="246" text-anchor="end" fill="#837b92" font-family="PingFang SC, sans-serif" font-size="12">反应进度 →</text>
    <text x="80" y="252" fill="#837b92" font-family="PingFang SC, sans-serif" font-size="11">吉布斯自由能 G</text>
    <text x="332" y="248" text-anchor="middle" fill="#5c556d" font-family="PingFang SC, sans-serif" font-size="13">ΔG = −nFE</text>
  </g>
</svg>
