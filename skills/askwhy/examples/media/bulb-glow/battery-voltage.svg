<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="title desc">
  <title id="title">电池如何建立电压</title>
  <desc id="desc">电池内部氧化还原反应转移电子，外部电路让电子流动，离子在电解液中迁移。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfaff"/>
      <stop offset="1" stop-color="#efeaff"/>
    </linearGradient>
    <marker id="electron" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#3e8ef7"/>
    </marker>
    <marker id="ion" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#2f8b6d"/>
    </marker>
  </defs>
  <rect width="800" height="450" rx="28" fill="url(#bg)"/>
  <text x="52" y="66" fill="#26213a" font-family="PingFang SC, sans-serif" font-size="28" font-weight="750">电池像电荷泵：反应维持两端电势差</text>
  <text x="52" y="94" fill="#77718b" font-family="PingFang SC, sans-serif" font-size="14">电子走外电路，离子走电解液，两条路径共同维持电中性。</text>

  <g transform="translate(95 132)">
    <rect width="610" height="250" rx="24" fill="#fff" stroke="#e2dcf2"/>
    <rect x="80" y="65" width="22" height="150" rx="9" fill="#f0a24b"/>
    <rect x="508" y="65" width="22" height="150" rx="9" fill="#5ba8f5"/>
    <text x="91" y="48" text-anchor="middle" fill="#c77a2c" font-family="PingFang SC, sans-serif" font-size="13" font-weight="750">负极 · 氧化</text>
    <text x="519" y="48" text-anchor="middle" fill="#398bd9" font-family="PingFang SC, sans-serif" font-size="13" font-weight="750">正极 · 还原</text>
    <rect x="102" y="111" width="406" height="68" rx="34" fill="#f0fbf6"/>
    <text x="305" y="151" text-anchor="middle" fill="#2f8b6d" font-family="PingFang SC, sans-serif" font-size="13">电解液中的离子迁移</text>
    <path d="M165 145h250" stroke="#2f8b6d" stroke-width="2.5" marker-end="url(#ion)"/>
    <path d="M91 65V26h438V65" fill="none" stroke="#3e8ef7" stroke-width="3" marker-end="url(#electron)"/>
    <circle cx="180" cy="26" r="8" fill="#3e8ef7"/>
    <circle cx="254" cy="26" r="8" fill="#3e8ef7"/>
    <circle cx="328" cy="26" r="8" fill="#3e8ef7"/>
    <circle cx="402" cy="26" r="8" fill="#3e8ef7"/>
    <text x="309" y="16" text-anchor="middle" fill="#398bd9" font-family="PingFang SC, sans-serif" font-size="11">外电路：电子流动</text>
    <text x="305" y="218" text-anchor="middle" fill="#6c657b" font-family="PingFang SC, sans-serif" font-size="12">反应持续补充被外电路消耗的电荷分离</text>
  </g>
</svg>
