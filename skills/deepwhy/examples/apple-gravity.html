ion":"为什么所有物体在真空中会以相同加速度下落？","why":"比较引力质量与惯性质量，继续检验拉绳比喻的边界。","sourceIds":["openstax-gravity"]},{"question":"引力波经过时，探测器怎样区分信号和地震噪声？","why":"把实验证据拆成测量、模型和排除替代解释。","sourceIds":["ligo-gravity-waves"]},{"question":"黑洞附近的时空弯曲与地球附近有什么不同？","why":"从弱场苹果运动走向强场引力。","sourceIds":["einstein-online-gravity"]}]}</script>
  <script>
    (() => {
      "use strict";

      const TYPE_META = {
        phenomenon: { label: "现象", short: "Phenomenon", color: "#22c55e" },
        mechanism: { label: "机制", short: "Mechanism", color: "#3b82f6" },
        principle: { label: "原理", short: "Principle", color: "#8b5cf6" },
        theory: { label: "理论", short: "Theory", color: "#f59e0b" },
        frontier: { label: "前沿", short: "Frontier", color: "#ef4444" },
        boundary: { label: "边界", short: "Boundary", color: "#94a3b8" }
      };
      const STATUS_LABELS = {
        complete: "已核验",
        partial: "部分核验",
        insufficient: "资料不足"
      };
      const CLAIM_LABELS = {
        verified: "已验证",
        research: "研究中",
        speculative: "推测"
      };
      const EVENT_LABELS = {
        background: "背景",
        paper: "论文 / 发表",
        proposal: "提出 / 方案",
        prototype: "原型 / 实验",
        operational: "投入运行",
        adoption: "广泛采用",
        boundary: "边界 / 转折"
      };
      const BG_TABS = ["videos", "people", "institutions", "applications", "timeline", "frontier", "sources"];

      let data;
      try {
        data = JSON.parse(document.getElementById("deepwhy-data").textContent);
      } catch (error) {
        document.body.innerHTML = "<main style='padding:2rem'><h1>内容数据无法解析</h1><p>请重新运行构建脚本并检查 JSON。</p></main>";
        console.error(error);
        return;
      }

      const videoMap = new Map(data.videos.items.map(video => [video.id, video]));
      const nodeMap = new Map(data.chain.nodes.map(node => [node.id, node]));
      const branchMap = new Map();
      data.chain.nodes.forEach(node => {
        node.branches.forEach(branch => branchMap.set(branch.id, { ...branch, parentId: node.id }));
      });

      const state = {
        selectedNodeId: data.chain.nodes[0].id,
        selectedBranchId: null,
        openBranchNodeId: null,
        tab: "understand",
        globalView: null,
        quizScope: "node",
        quizIndex: 0,
        activeVideoId: data.videos.items[0]?.id || null,
        backgroundTab: "people",
        backgroundNodeId: null,
        backgroundOnLoad: null,
        timelineFilter: "all",
        quizAnswers: {}
      };
      let scrollToInitialNode = false;

      const byId = id => document.getElementById(id);

      function el(tag, className, text) {
        const node = document.createElement(tag);
        if (className) node.className = className;
        if (text !== undefined && text !== null) node.textContent = String(text);
        return node;
      }

      function link(url, text, className = "") {
        const anchor = el("a", className, text);
        anchor.href = url;
        anchor.target = "_blank";
        anchor.rel = "noopener noreferrer";
        return anchor;
      }

      function formatNumber(value) {
        return Number.isInteger(value) ? new Intl.NumberFormat("zh-CN").format(value) : "未获取";
      }

      function sanitizeSvg(raw) {
        if (typeof raw !== "string" || !raw.trim()) return null;
        const doc = new DOMParser().parseFromString(raw, "image/svg+xml");
        if (doc.querySelector("parsererror")) return null;
        const root = doc.documentElement;
        if (!root || root.localName.toLowerCase() !== "svg") return null;
        const blocked = new Set(["script", "foreignobject", "iframe", "object", "embed"]);
        [root, ...root.querySelectorAll("*")].forEach(node => {
          if (blocked.has(node.localName.toLowerCase())) {
            node.remove();
            return;
          }
          [...node.attributes].forEach(attribute => {
            const name = attribute.name.toLowerCase();
            const value = attribute.value.trim();
            if (name.startsWith("on") || name === "style" || /^javascript:/i.test(value)) {
              node.removeAttribute(attribute.name);
            }
            if ((name === "href" || name.endsWith(":href")) && !value.startsWith("#")) {
              node.removeAttribute(attribute.name);
            }
          });
        });
        return new XMLSerializer().serializeToString(root);
      }

      let interactionCounter = 0;

      function formatInteractionValue(value) {
        const rounded = Math.round(value * 100) / 100;
        return Number.isInteger(rounded) ? String(rounded) : rounded.toFixed(2);
      }

      function renderInteraction(interaction) {
        if (!interaction) return null;
        const wrap = el("div", "visual-interaction");
        wrap.append(el("strong", "", interaction.prompt));
        if (interaction.kind === "inverse-square" || interaction.kind === "range") {
          const label = el("label");
          label.append(el("span", "", interaction.label));
          const output = el("output");
          output.setAttribute("aria-live", "polite");
          const input = el("input");
          input.type = "range";
          input.min = String(interaction.min);
          input.max = String(interaction.max);
          input.step = String(interaction.step);
          input.value = String(interaction.initial);
          input.id = `interaction-${++interactionCounter}`;
          label.htmlFor = input.id;
          const update = () => {
            const value = Number(input.value);
            const formatted = formatInteractionValue(value);
            output.textContent = interaction.resultTemplate
              .replaceAll("{value}", formatted)
              .replaceAll("{inverseSquare}", (1 / (value * value)).toFixed(3));
          };
          input.addEventListener("input", update);
          update();
          label.append(output);
          wrap.append(label, input);
          return wrap;
        }
        if (interaction.kind === "prediction") {
          const options = el("div", "interaction-options");
          const feedback = el("p", "interaction-feedback");
          feedback.hidden = true;
          feedback.setAttribute("aria-live", "polite");
          interaction.options.forEach((option, index) => {
            const button = el("button", "interaction-option", option.label);
            button.type = "button";
            button.setAttribute("aria-pressed", "false");
            button.addEventListener("click", () => {
              options.querySelectorAll(".interaction-option").forEach(item => {
                item.setAttribute("aria-pressed", String(item === button));
              });
              feedback.hidden = false;
              feedback.dataset.correct = String(index === interaction.correctIndex);
              feedback.textContent = option.feedback;
            });
            options.append(button);
          });
          wrap.append(options, feedback);
          return wrap;
        }
        if (interaction.kind === "toggle") {
          const label = el("label", "interaction-toggle");
          label.append(el("span", "", interaction.label));
          const input = el("input");
          input.type = "checkbox";
          input.checked = Boolean(interaction.initial);
          input.id = `interaction-${++interactionCounter}`;
          label.htmlFor = input.id;
          const state = el("span", "toggle-state");
          const feedback = el("p", "interaction-feedback");
          feedback.setAttribute("aria-live", "polite");
          const update = () => {
            state.textContent = input.checked ? interaction.onLabel : interaction.offLabel;
            feedback.textContent = input.checked
              ? interaction.onFeedback
              : interaction.offFeedback;
          };
          input.addEventListener("change", update);
          update();
          label.append(input, state);
          wrap.append(label, feedback);
          return wrap;
        }
        return null;
      }

      function renderMotionReplay(media) {
        if (!media || media.tagName.toLowerCase() !== "svg") return null;
        if (!media.querySelector("animate, animateTransform, animateMotion")) return null;
        if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return null;
        const replay = el("button", "button quiet motion-replay", "重播动画");
        replay.type = "button";
        replay.addEventListener("click", () => {
          try {
            media.setCurrentTime(0);
            media.unpauseAnimations();
          } catch (error) {
            // Static labels remain available if SVG animation APIs are unavailable.
          }
        });
        return replay;
      }

      const LAB_LABELS = {
        simulation: "模拟实验",
        diagram: "探索图解",
        code: "代码运行",
        game: "决策游戏",
        spatial3d: "空间观察",
        procedural: "流程练习",
      };
      const labFrameContexts = new WeakMap();

      function labBaseStyle() {
        const styles = getComputedStyle(document.documentElement);
        const token = name => styles.getPropertyValue(name).trim();
        return `<style>
          :root {
            color-scheme: light;
            --lab-bg: ${token("--surface-soft") || "#f7f2e8"};
            --lab-surface: ${token("--surface-solid") || "#fffaf0"};
            --lab-text: ${token("--text") || "#26332e"};
            --lab-muted: ${token("--muted") || "#6c756d"};
            --lab-accent: ${token("--accent") || "#1d6d67"};
            --lab-accent-2: ${token("--accent-2") || "#9b4d36"};
            --lab-border: ${token("--line") || "#c8bda9"};
            --lab-display: ${token("--display") || "Georgia,serif"};
            --lab-sans: ${token("--sans") || "system-ui,sans-serif"};
            --lab-mono: ${token("--mono") || "ui-monospace,monospace"};
          }
          *, *::before, *::after { box-sizing: border-box; }
          html, body {
            margin: 0;
            min-height: 100%;
            background: var(--lab-bg);
            color: var(--lab-text);
            font-family: var(--lab-sans);
          }
          button, input, select, textarea { font: inherit; }
          button { min-height: 44px; touch-action: manipulation; }
          :focus-visible { outline: 3px solid color-mix(in srgb, var(--lab-accent) 55%, transparent); outline-offset: 2px; }
          @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
              animation-duration: 0.01ms !important;
              animation-iteration-count: 1 !important;
              scroll-behavior: auto !important;
              transition-duration: 0.01ms !important;
            }
          }
        </style>`;
      }

      function decorateLabDocument(raw) {
        const csp = '<meta http-equiv="Content-Security-Policy" content="default-src \'none\'; style-src \'unsafe-inline\'; script-src \'unsafe-inline\' \'unsafe-eval\' https://cdn.jsdelivr.net/npm/three@0.160.0/; img-src data: blob:; font-src data:; media-src data: blob:; connect-src \'none\'; worker-src blob:; frame-src \'none\'">';
        const injection = `${csp}${labBaseStyle()}`;
        if (/<head[^>]*>/i.test(raw)) {
          return raw.replace(/<head[^>]*>/i, match => `${match}\n${injection}`);
        }
        return raw.replace(
          /<html[^>]*>/i,
          match => `${match}<head>${injection}</head>`
        );
      }

      function closeExpandedLab() {
        document.querySelectorAll(".lab-shell.is-expanded").forEach(shell => {
          shell.classList.remove("is-expanded");
          const button = shell.querySelector(".lab-expand");
          if (button) button.textContent = "放大实验";
        });
        document.body.classList.remove("lab-expanded");
      }

      function renderLab(lab) {
        if (!lab) return null;
        const shell = el("section", "lab-shell");
        shell.dataset.labKind = lab.kind;
        shell.dataset.complete = "false";
        shell.style.setProperty("--lab-height", `${lab.height}px`);

        const head = el("div", "lab-head");
        const heading = el("div");
        heading.append(
          el("span", "detail-kicker", `交互实验室 · ${LAB_LABELS[lab.kind] || lab.kind}`),
          el("h3", "", lab.title),
          el("p", "lab-goal", lab.goal)
        );
        const expand = el("button", "button quiet lab-expand", "放大实验");
        expand.type = "button";
        expand.setAttribute("aria-expanded", "false");
        expand.addEventListener("click", () => {
          const next = !shell.classList.contains("is-expanded");
          closeExpandedLab();
          if (next) {
            shell.classList.add("is-expanded");
            document.body.classList.add("lab-expanded");
            expand.textContent = "关闭放大";
            expand.setAttribute("aria-expanded", "true");
          }
        });
        head.append(heading, expand);

        const frameWrap = el("div", "lab-frame-wrap");
        const frame = el("iframe", "lab-frame");
        frame.title = `交互实验室：${lab.title}`;
        frame.setAttribute("sandbox", "allow-scripts");
        frame.setAttribute("referrerpolicy", "no-referrer");
        frame.loading = "lazy";
        const statusSummary = el("span", "", "实验加载中…");
        const result = el("div", "lab-result");
        result.hidden = true;
        result.append(
          el("span", "detail-kicker", "实验后的结论"),
          el("p", "", lab.completionText)
        );
        const reflection = el("div", "lab-reflection");
        reflection.hidden = true;
        reflection.append(
          el("span", "detail-kicker", "用自己的话说一遍"),
          el("p", "", lab.reflectionPrompt)
        );
        const reflectionInput = el("textarea");
        reflectionInput.setAttribute("aria-label", lab.reflectionPrompt);
        reflectionInput.placeholder = "先写下你的解释，再查看参考思路。";
        const reflectActions = el("div", "lab-reflection-actions");
        const reveal = el("button", "button quiet", "查看参考思路");
        reveal.type = "button";
        reveal.disabled = true;
        const reference = el("p", "", lab.completionText);
        reference.hidden = true;
        reflectionInput.addEventListener("input", () => {
          reveal.disabled = !reflectionInput.value.trim();
        });
        reveal.addEventListener("click", () => {
          reference.hidden = false;
          reveal.disabled = true;
          reveal.textContent = "参考思路已展开";
        });
        reflectActions.append(reveal);
        reflection.append(reflectionInput, reflectActions, reference);

        const fallback = el("details", "lab-fallback");
        fallback.append(
          el("summary", "", "实验无法运行时查看等价说明"),
          el("p", "", lab.fallbackText)
        );

        const status = el("div", "lab-status");
        status.append(
          el("span", "lab-status-dot"),
          statusSummary
        );
        status.setAttribute("aria-live", "polite");
        frameWrap.append(frame);
        shell.append(head, frameWrap, status, result, reflection, fallback);

        const context = {
          shell,
          statusSummary,
          result,
          reflection,
          completed: false,
        };
        const contentWindow = frame.contentWindow;
        if (contentWindow) labFrameContexts.set(contentWindow, context);
        frame.addEventListener("load", () => {
          if (frame.contentWindow) labFrameContexts.set(frame.contentWindow, context);
          if (!context.completed) {
            statusSummary.textContent = "实验已加载，请按目标开始操作。";
          }
        });
        frame.srcdoc = decorateLabDocument(lab.html);
        return shell;
      }

      function handleLabMessage(event) {
        const context = labFrameContexts.get(event.source);
        const payload = event.data;
        if (
          !context ||
          !payload ||
          payload.source !== "deepwhy-lab" ||
          payload.type !== "state"
        ) {
          return;
        }
        const summary =
          typeof payload.summary === "string"
            ? payload.summary.slice(0, 500)
            : "实验状态已更新。";
        context.statusSummary.textContent = summary;
        context.completed = payload.complete === true;
        context.shell.dataset.complete = String(context.completed);
        context.result.hidden = !context.completed;
        context.reflection.hidden = !context.completed;
      }

      function settleReducedMotion(svg) {
        if (!svg) return;
        const animations = svg.querySelectorAll(
          "animate, animateTransform, animateMotion"
        );
        if (!animations.length) return;
        if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
        animations.forEach(animation => {
          try {
            animation.endElement();
          } catch (error) {
            // A static fallback in the SVG still remains available.
          }
        });
        svg.dataset.reducedMotion = "true";
      }

      function renderDiagram(diagram, { compact = false, className = "" } = {}) {
        if (!diagram) return null;
        const figure = el("figure", `figure-frame ${className}`.trim());
        figure.dataset.visualKind = diagram.kind;
        let media = null;
        if (diagram.mode === "svg") {
          const safeSvg = sanitizeSvg(diagram.svg);
          if (safeSvg) {
            const holder = el("div");
            holder.innerHTML = safeSvg;
            media = holder.firstElementChild;
            if (media) {
              media.setAttribute("role", "img");
              media.setAttribute("aria-label", diagram.alt);
              settleReducedMotion(media);
            }
          }
        } else if (/^https?:\/\//.test(diagram.src || "")) {
          media = el("img");
          media.src = diagram.src;
          media.alt = diagram.alt;
          media.loading = "lazy";
          media.referrerPolicy = "no-referrer";
        }
        if (!media) return null;
        const interaction = compact ? null : renderInteraction(diagram.interaction);
        if (interaction && diagram.interaction.kind === "prediction") {
          figure.append(interaction);
        }
        figure.append(media);
        const replay = compact ? null : renderMotionReplay(media);
        if (replay) figure.append(replay);
        if (!compact && diagram.formula) {
          figure.append(el("div", "visual-formula", diagram.formula));
        }
        if (!compact) {
          figure.append(el("figcaption", "", diagram.caption));
          if (interaction && diagram.interaction.kind !== "prediction") {
            figure.append(interaction);
          }
        }
        return figure;
      }

      function renderManim(manim) {
        if (!manim) return null;
        const feature = el("section", "manim-feature");
        feature.dataset.manim = "true";
        feature.setAttribute("aria-label", `动画图解：${manim.alt}`);
        const head = el("div", "manim-head");
        const heading = el("div");
        heading.append(
          el("span", "detail-kicker", "动画图解"),
          el("strong", "", manim.alt)
        );
        const replay = el("button", "manim-replay", "重播");
        replay.type = "button";
        head.append(heading, replay);

        const media = el("div", "manim-media");
        const reducedMotion = window.matchMedia(
          "(prefers-reduced-motion: reduce)"
        ).matches;
        feature.dataset.autoplay = String(!reducedMotion);
        const video = el("video");
        video.muted = true;
        video.loop = true;
        video.controls = true;
        video.playsInline = true;
        video.preload = "metadata";
        video.poster = manim.posterSrc;
        video.src = manim.videoSrc;
        video.setAttribute("aria-label", manim.alt);
        if (!reducedMotion) video.autoplay = true;

        const showFallback = () => {
          const safeSvg = sanitizeSvg(manim.fallbackSvg);
          if (!safeSvg) {
            media.replaceChildren(
              el("p", "empty-state", "动画不可用，请阅读下方文字说明。")
            );
            return;
          }
          const holder = el("div");
          holder.innerHTML = safeSvg;
          const svg = holder.firstElementChild;
          if (!svg) return;
          svg.setAttribute("role", "img");
          svg.setAttribute("aria-label", manim.alt);
          settleReducedMotion(svg);
          media.replaceChildren(svg);
        };

        video.addEventListener("error", showFallback, { once: true });
        replay.addEventListener("click", () => {
          if (!media.contains(video)) {
            media.replaceChildren(video);
          }
          try {
            video.currentTime = 0;
            const playback = video.play();
            if (playback && typeof playback.catch === "function") {
              playback.catch(showFallback);
            }
          } catch (error) {
            showFallback();
          }
        });
        media.append(video);
        feature.append(head, media, el("p", "manim-caption", manim.caption));

        if (manim.transcript && manim.transcript.length) {
          const transcript = el("details", "manim-transcript");
          transcript.append(el("summary", "", "查看动画文字说明"));
          const cues = el("ol");
          manim.transcript.forEach(cue => {
            const item = el("li");
            item.append(
              el("time", "", `${formatDuration(cue.start)}–${formatDuration(cue.end)}`),
              document.createTextNode(` ${cue.text}`)
            );
            cues.append(item);
          });
          transcript.append(cues);
          feature.append(transcript);
        }
        return feature;
      }

      function disclosure(label, text) {
        if (!text) return null;
        const details = el("details", "disclosure");
        details.append(el("summary", "", label));
        const body = el("div", "disclosure-body");
        body.append(el("p", "", text));
        details.append(body);
        return details;
      }

      function renderHero() {
        document.documentElement.lang = data.meta.language || "zh-CN";
        document.title = `${data.meta.topic} · DeepWhy`;
        byId("page-title").textContent = data.meta.topic;
        const opening = byId("opening-copy");
        opening.append(document.createTextNode(data.chain.openingScenario));
        opening.append(el("strong", "", data.chain.openingQuestion));
        byId("chain-count").textContent = `${data.chain.nodes.length} 层知识链`;
        byId("chain-title").textContent = data.chain.title;
        byId("key-insight").textContent = data.presentation.centralInsight;
        byId("takeaway").textContent = data.chain.takeaway;
        const openingVisual = renderDiagram(data.chain.openingVisual, { className: "opening-visual" });
        const placeholder = byId("opening-visual");
        if (openingVisual) placeholder.replaceWith(openingVisual);
        else placeholder.remove();

        if (data.meta.premiseCheck.status !== "confirmed") {
          const notice = el("div", "premise-notice");
          notice.append(
            el("strong", "", data.meta.premiseCheck.status === "corrected" ? "前提已校正：" : "前提待核验："),
            document.createTextNode(data.meta.premiseCheck.note)
          );
          byId("premise-notice").append(notice);
        }
        if (data.meta.evidenceGaps.length) {
          byId("gap-link-wrap").hidden = false;
          const button = byId("gap-link");
          button.textContent = `证据边界 · ${data.meta.evidenceGaps.length} 项`;
          button.addEventListener("click", () => openBackground("sources"));
        }

        byId("next-summary").textContent = `继续追问 · ${data.nextQuestions.length} 个方向`;
        const nextList = byId("next-question-list");
        data.nextQuestions.forEach(item => {
          const li = el("li");
          const anchor = el("a", "next-question-link");
          anchor.href = deepwhyQuestionUrl(item.question);
          anchor.target = "_blank";
          anchor.rel = "noopener noreferrer";
          const copy = el("span", "next-question-copy");
          copy.append(
            el("strong", "", item.question),
            el("span", "", item.why)
          );
          anchor.append(copy, el("span", "next-question-arrow", "继续探索 ↗"));
          li.append(anchor);
          nextList.append(li);
        });
      }

      function deepwhyQuestionUrl(question) {
        const url = new URL("https://deepwhy.cn/");
        url.searchParams.set("topic", data.meta.topic);
        url.searchParams.set("question", question);
        return url.href;
      }

      function backgroundItemsFor(tab, nodeOverride = null) {
        const items = data.background[tab] || [];
        const node = nodeOverride || (
          state.backgroundNodeId ? nodeMap.get(state.backgroundNodeId) : null
        );
        if (!node) return items;
        const nodeSources = new Set(node.sourceIds || []);
        return items.filter(item =>
          (item.sourceIds || []).some(sourceId => nodeSources.has(sourceId))
        );
      }

      function renderChain() {
        const root = byId("chain-start");
        root.replaceChildren();
        const legend = byId("chain-legend");
        legend.replaceChildren();
        [...new Set(data.chain.nodes.map(node => node.type))].forEach(type => {
          const item = el("span", "chain-legend-item");
          const dot = el("span", "chain-legend-dot");
          dot.style.setProperty("--legend-color", TYPE_META[type].color);
          item.append(dot, document.createTextNode(TYPE_META[type].label));
          legend.append(item);
        });
        data.chain.nodes.forEach((node, index) => {
          const row = el("div", "chain-row");
          row.dataset.nodeId = node.id;
          row.dataset.selected = String(node.id === state.selectedNodeId);
          const nodeColor = TYPE_META[node.type].color;
          const nextNode = data.chain.nodes[index + 1];
          row.style.setProperty("--node-color", nodeColor);
          row.style.setProperty(
            "--next-node-color",
            nextNode ? TYPE_META[nextNode.type].color : nodeColor
          );

          const left = el("div", "branch-rail left");
          const right = el("div", "branch-rail right");
          const branchesOpen = state.openBranchNodeId === node.id;
          if (branchesOpen) {
            node.branches.forEach((branch, branchIndex) => {
              const button = el("button", "branch-button", `↳ ${branch.question}`);
              button.type = "button";
              button.dataset.branchId = branch.id;
              button.addEventListener("click", event => {
                event.stopPropagation();
                selectBranch(node.id, branch.id);
              });
              (branchIndex % 2 === 0 ? left : right).append(button);
            });
          }

          const card = el("button", "node-card");
          card.type = "button";
          card.dataset.nodeId = node.id;
          card.dataset.nodeType = node.type;
          card.style.setProperty("--node-color", nodeColor);
          card.setAttribute("aria-current", String(node.id === state.selectedNodeId));
          const head = el("div", "node-head");
          head.append(
            el("span", "node-index", String(index + 1).padStart(2, "0")),
            el("span", "node-track", `${TYPE_META[node.type].label} · ${TYPE_META[node.type].short}`),
            el("span", "node-status", STATUS_LABELS[node.status])
          );
          head.lastElementChild.dataset.status = node.status;
          card.append(head);
          card.append(el("p", "node-concept", node.concept));
          card.append(el("h2", "node-question", node.question));
          card.append(el("p", "node-answer", node.answer));
          if (node.diagram) {
            card.dataset.visualKind = node.diagram.kind;
            const mini = renderDiagram(node.diagram, {
              compact: true,
              className: "node-mini-visual",
            });
            if (mini) card.append(mini);
          } else {
            card.dataset.visualKind = "text";
          }
          const footer = el("div", "node-footer");
          footer.append(
            el("span", "", node.diagram ? "含原理图" : "查看解释"),
            el("span", "", node.branches.length ? `${node.branches.length} 个分支` : "主链")
          );
          card.append(footer);
          card.addEventListener("click", () => selectNode(node.id));
          const stack = el("div", "node-stack");
          stack.append(card);
          if (node.id === state.selectedNodeId && node.branches.length) {
            const branchToggle = el(
              "button",
              "branch-toggle",
              branchesOpen ? "收起分支" : `展开 ${node.branches.length} 个分支`
            );
            branchToggle.type = "button";
            branchToggle.setAttribute("aria-expanded", String(branchesOpen));
            branchToggle.addEventListener("click", () => {
              state.openBranchNodeId = branchesOpen ? null : node.id;
              if (!branchesOpen) state.selectedBranchId = null;
              renderChain();
              renderInspector();
            });
            stack.append(branchToggle);
          }
          row.append(left, stack, right);
          root.append(row);
          if (index < data.chain.nodes.length - 1) {
            const connector = el("div", "chain-connector");
            connector.style.setProperty("--node-color", nodeColor);
            connector.style.setProperty(
              "--next-node-color",
              TYPE_META[data.chain.nodes[index + 1].type].color
            );
            root.append(connector);
          }
        });
        const finalColor = TYPE_META[data.chain.nodes.at(-1).type].color;
        const endConnector = el("div", "chain-connector");
        endConnector.style.setProperty("--node-color", finalColor);
        endConnector.style.setProperty("--next-node-color", "#7a4cf4");
        const nextPlaceholder = el(
          "button",
          "chain-next-placeholder",
          "回到第一层，逐节点检查理解"
        );
        nextPlaceholder.type = "button";
        nextPlaceholder.addEventListener("click", () =>
          selectNode(data.chain.nodes[0].id)
        );
        root.append(endConnector, nextPlaceholder);
      }

      function selectedNode() {
        return nodeMap.get(state.selectedNodeId);
      }

      function selectedBranch() {
        return state.selectedBranchId ? branchMap.get(state.selectedBranchId) : null;
      }

      function updateProgress() {
        const index = data.chain.nodes.findIndex(node => node.id === state.selectedNodeId);
        const percent = ((index + 1) / data.chain.nodes.length) * 100;
        const branch = selectedBranch();
        const nextNode = data.chain.nodes[index + 1];
        byId("progress-fill").style.width = `${percent}%`;
        byId("progress-label").textContent = `第 ${index + 1} / ${data.chain.nodes.length} 层`;
        byId("depth-label").textContent = `${TYPE_META[selectedNode().type].label} · 当前节点已高亮`;
        byId("journey-position").textContent = branch
          ? `分支 · 来自第 ${index + 1} / ${data.chain.nodes.length} 层`
          : `当前位置 · 第 ${index + 1} / ${data.chain.nodes.length} 层 · ${TYPE_META[selectedNode().type].label}`;
        if (nextNode) {
          byId("next-action-copy").textContent = `下一问：${nextNode.question}`;
          byId("hero-next-action").textContent = `进入第 ${index + 2} 层`;
        } else {
          byId("next-action-copy").textContent = "主链已到边界，检查当前节点的理解。";
          byId("hero-next-action").textContent = "检查本节点";
        }
      }

      function selectNode(nodeId, { open = true, updateHash = true } = {}) {
        if (!nodeMap.has(nodeId)) return;
        state.selectedNodeId = nodeId;
        state.selectedBranchId = null;
        state.openBranchNodeId = null;
        state.globalView = null;
        state.quizScope = "node";
        state.quizIndex = 0;
        renderChain();
        updateProgress();
        renderInspector();
        if (open && window.innerWidth <= 880) openInspector();
        if (updateHash && history.replaceState) {
          history.replaceState(null, "", `#node-${nodeId}`);
        }
      }

      function selectBranch(parentId, branchId, { open = true } = {}) {
        state.selectedNodeId = parentId;
        state.selectedBranchId = branchId;
        state.openBranchNodeId = parentId;
        state.tab = "understand";
        state.globalView = null;
        state.quizScope = "node";
        renderChain();
        updateProgress();
        renderInspector();
        if (open && window.innerWidth <= 880) openInspector();
        if (history.replaceState) history.replaceState(null, "", `#branch-${branchId}`);
      }

      function setGlobalView(view) {
        state.globalView = view;
        state.selectedBranchId = null;
        state.quizScope = view === "quiz" ? "all" : "node";
        state.quizIndex = 0;
        if (view === "quiz") state.tab = "quiz";
        renderInspector();
        openInspector();
      }

      function renderInspector() {
        const node = selectedNode();
        const branch = selectedBranch();
        const item = branch || node;
        const globalTitles = {
          development: "从起点到当前",
          people: "相关人物",
          stage: "当前阶段与研究边界",
          videos: "视频资料库",
          quiz: "全局测验"
        };
        const globalSummaries = {
          development: "回看知识形成、验证与今天所处的位置。",
          people: "查看推动这项知识发展的关键人物与协作背景。",
          stage: "了解最近的研究、部署状态与仍未解决的问题。",
          videos: `浏览全部 ${data.videos.items.length} 条外站视频。`,
          quiz: `完成覆盖 ${data.chain.nodes.length} 个知识点的 ${data.assessment.items.length} 道题。`
        };
        document.querySelectorAll("[data-global-view]").forEach(button => {
          button.setAttribute(
            "aria-pressed",
            String(button.dataset.globalView === state.globalView)
          );
        });
        document.querySelector(".tabs").hidden = Boolean(state.globalView);
        document.querySelector(".inspector-nav").hidden = Boolean(state.globalView);
        if (state.globalView) {
          byId("inspector-type").textContent = "全局视图 · GLOBAL";
          byId("inspector-title").textContent =
            globalTitles[state.globalView] || "全局视图";
          byId("inspector-answer").textContent =
            globalSummaries[state.globalView] || data.background.summary;
          byId("branch-origin-wrap").replaceChildren();
          const globalBody = byId("inspector-body");
          globalBody.replaceChildren();
          if (state.globalView === "development") {
            renderGlobalDevelopment(globalBody);
          } else if (state.globalView === "people") {
            renderGlobalPeople(globalBody);
          } else if (state.globalView === "stage") {
            renderGlobalStage(globalBody);
          } else if (state.globalView === "videos") {
            renderGlobalVideoLibrary(globalBody);
          } else {
            renderQuiz(globalBody, node);
          }
          return;
        }
        byId("inspector-type").textContent = `${TYPE_META[item.type].label} · ${TYPE_META[item.type].short}`;
        byId("inspector-title").textContent = branch ? `分支：${branch.question}` : node.question;
        byId("inspector-answer").textContent = item.answer;
        const originWrap = byId("branch-origin-wrap");
        originWrap.replaceChildren();
        if (branch) {
          const origin = el("div", "branch-origin");
          origin.append(el("span", "", `从「${node.concept}」分叉`));
          const back = el("button", "back-branch", "返回主链");
          back.type = "button";
          back.addEventListener("click", () => selectNode(node.id));
          origin.append(back);
          originWrap.append(origin);
        }
        document.querySelectorAll(".tab-button").forEach(button => {
          button.setAttribute("aria-selected", String(button.dataset.tab === state.tab));
        });
        const body = byId("inspector-body");
        body.replaceChildren();
        if (branch) {
          renderBranchBody(body, node, branch);
        } else if (state.tab === "understand") {
          renderUnderstand(body, node);
        } else if (state.tab === "video") {
          renderVideo(body, node);
        } else if (state.tab === "research") {
          renderResearch(body, node);
        } else if (state.tab === "industry") {
          renderIndustry(body, node);
        } else {
          renderQuiz(body, node);
        }
        const index = data.chain.nodes.findIndex(n => n.id === node.id);
        byId("prev-node").disabled = index === 0;
        byId("next-node").disabled = index === data.chain.nodes.length - 1;
      }

      function renderBranchBody(root, parent, branch) {
        const lead = el("p", "detail-lead");
        lead.append(el("span", "detail-kicker", "分支答案"), document.createTextNode(branch.answer));
        root.append(lead);
        const explanation = disclosure(
          "这条分支如何回到主线",
          `它从「${parent.concept}」横向展开，不替代主链中的下一层。`
        );
        if (explanation) root.append(explanation);
      }

      function renderUnderstand(root, node) {
        const bridge = el("div", "lesson-bridge");
        bridge.append(
          el("span", "detail-kicker", "接着上一层"),
          el("p", "", node.guide.bridge)
        );
        root.append(bridge);
        if (node.analogy) {
          const analogy = el("div", "plain-language");
          analogy.append(
            el("span", "detail-kicker", "先想象这个场景"),
            el("p", "", node.analogy)
          );
          root.append(analogy);
        }
        const manim = renderManim(node.manim);
        if (manim) root.append(manim);

      function formatDuration(seconds) {
        const hours = Math.floor(seconds / 3600);
        const minutes = Math.floor((seconds % 3600) / 60);
        const rest = seconds % 60;
        return hours
          ? `${hours}:${String(minutes).padStart(2, "0")}:${String(rest).padStart(2, "0")}`
          : `${minutes}:${String(rest).padStart(2, "0")}`;
      }

      function renderQuiz(root, node) {
        const questions = quizzesForCurrent();
        if (!questions.length) {
          root.append(el("p", "empty-state", "这个节点还没有生成题目。"));
          return;
        }
        const index = Math.min(state.quizIndex, questions.length - 1);
        const question = questions[index];
        const currentAnswer = state.quizAnswers[question.id];
        const top = el("div", "quiz-topline");
        top.append(
          el("span", "", state.quizScope === "all" ? "全局测验" : "节点小测")
        );
        top.append(el("span", "", `${index + 1} / ${questions.length}`));
        root.append(top);
        root.append(renderQuizQuestion(question));
        if (questions.length > 1) {
          const nav = el("div", "quiz-actions");
          const prev = el("button", "button quiet", "上一题");
          prev.type = "button";
          prev.disabled = index === 0;
          prev.addEventListener("click", () => {
            state.quizIndex = Math.max(0, index - 1);
            renderInspector();
          });
          nav.append(prev);
          if (!(index === questions.length - 1 && currentAnswer)) {
            const next = el("button", "button quiet", "下一题");
            next.type = "button";
            next.disabled = index === questions.length - 1;
            next.addEventListener("click", () => {
              state.quizIndex = Math.min(questions.length - 1, index + 1);
              renderInspector();
            });
            nav.append(next);
          }
          root.append(nav);
        }
        const answerCard = renderAnswerCard(questions, index);
        if (answerCard) root.append(answerCard);
      }

      function renderAnswerCard(questions, currentIndex) {
        const answered = questions
          .map(question => state.quizAnswers[question.id])
          .filter(Boolean);
        if (!answered.length) return null;
        const card = el("section", "answer-card");
        card.setAttribute("aria-label", "答题卡");
        const head = el("div", "answer-card-head");
        const correct = answered.filter(answer => answer.result === "correct").length;
        const incorrect = answered.length - correct;
        head.append(
          el("strong", "", "答题卡"),
          el(
            "span",
            "",
            `已答 ${answered.length}/${questions.length} · 正确 ${correct} · 错误 ${incorrect}`
          )
        );
        const grid = el("div", "answer-card-grid");
        questions.forEach((question, index) => {
          const answer = state.quizAnswers[question.id];
          const button = el("button", "answer-card-button");
          button.type = "button";
          button.dataset.result = answer
            ? answer.result
            : "unanswered";
          button.setAttribute("aria-current", String(index === currentIndex));
          button.setAttribute(
            "aria-label",
            `第 ${index + 1} 题，${
              answer
                ? answer.result === "correct"
                  ? "回答正确"
                  : "回答错误"
                : "未作答"
            }`
          );
          button.append(
            el("strong", "", String(index + 1)),
            el(
              "span",
              "",
              answer
                ? answer.result === "correct"
                  ? "正确"
                  : "错误"
                : "未答"
            )
          );
          button.addEventListener("click", () => {
            state.quizIndex = index;
            renderInspector();
          });
          grid.append(button);
        });
        card.append(head, grid);
        return card;
      }

      function renderQuizQuestion(item) {
        const card = el("article", "quiz-card");
        const form = el("form");
        form.dataset.quizId = item.id;
        const fieldset = el("fieldset");
        const legend = el("legend", "", item.prompt);
        fieldset.append(legend);
        const optionLabels = [];
        item.options.forEach((option, index) => {
          const label = el("label", "option");
          const input = el("input");
          input.type = "radio";
          input.name = `answer-${item.id}`;
          input.value = String(index);
          label.append(input, el("span", "", option));
          fieldset.append(label);
          optionLabels.push(label);
        });
        form.append(fieldset);
        const feedback = el("div", "quiz-feedback");
        feedback.setAttribute("aria-live", "polite");
        form.append(feedback);

        const markAnswer = selectedIndex => {
          optionLabels.forEach((label, index) => {
            delete label.dataset.result;
            if (index === item.correctIndex) label.dataset.result = "correct";
            if (index === selectedIndex && index !== item.correctIndex) {
              label.dataset.result = "incorrect";
            }
          });
        };

        fieldset.addEventListener("change", event => {
          if (!(event.target instanceof HTMLInputElement)) return;
          const selectedIndex = Number(event.target.value);
          const correct = selectedIndex === item.correctIndex;
          state.quizAnswers[item.id] = {
            id: item.id,
            result: correct ? "correct" : "incorrect",
            answer: String(selectedIndex)
          };
          renderInspector();
        });
        const savedAnswer = state.quizAnswers[item.id];
        if (savedAnswer) {
          const selectedInput = form.querySelector(
            `input[value="${savedAnswer.answer}"]`
          );
          if (selectedInput) selectedInput.checked = true;
          markAnswer(Number(savedAnswer.answer));
          renderQuizFeedback(feedback, item, savedAnswer);
        }
        card.append(form);
        return card;
      }

      function renderQuizFeedback(container, item, feedbackState) {
        container.dataset.result = feedbackState.result;
        if (feedbackState.result === "correct") {
          container.append(
            el("strong", "", "回答正确"),
            el("p", "", item.explanation)
          );
        } else {
          container.append(
            el("strong", "", "回答错误"),
            el("p", "", `正确答案：${item.options[item.correctIndex]}`),
            el("p", "", item.explanation)
          );
        }
      }

      function renderBackgroundTab() {
        const root = byId("background-body");
        root.replaceChildren();
        const tab = state.backgroundTab;
        const contextNode = state.backgroundNodeId
          ? nodeMap.get(state.backgroundNodeId)
          : null;
        const isGlobalVideoLibrary = tab === "videos" && !contextNode;
        byId("background-title").textContent = isGlobalVideoLibrary
          ? "视频资料库"
          : "研究背景";
        byId("background-summary").textContent = isGlobalVideoLibrary
          ? `共 ${data.videos.items.length} 条外站视频，点击封面可前往对应平台。`
          : contextNode
            ? `从「${contextNode.concept}」延伸的背景资料。${data.background.summary}`
            : data.background.summary;
        if (tab === "videos") {
          if (!contextNode) {
            renderGlobalVideoLibrary(root);
            return;
          }
          const videoIds = contextNode.videoIds || [];
          if (!videoIds.length) {
            root.append(el("p", "empty-state", "这个节点没有指定视频。"));
          } else {
            renderVideoExperience(
              root,
              videoIds,
              "background"
            );
          }
          return;
        }
        if (tab === "timeline") {
          renderTimeline(root);
          return;
        }
        if (tab === "frontier") {
          const items = backgroundItemsFor("frontier");
          if (!items.length) root.append(el("p", "empty-state", "未找到可核验的前沿资料。"));
          items.forEach(item => {
            const card = el("article", "background-card");
            const status = el("span", "claim-status", CLAIM_LABELS[item.status]);
            status.dataset.claim = item.status;
            card.append(status, el("h3", "", item.title));
            card.append(el("p", "", `发布：${item.publishedAt} · 路线：${item.route}`));
            card.append(el("p", "", `当前证据：${item.finding}`));
            card.append(el("p", "", `仍未解决：${item.unresolved}`));
            root.append(card);
          });
          if (data.background.gap) root.append(el("p", "gap-list", data.background.gap));
          return;
        }
        if (tab === "sources") {
          if (data.meta.evidenceGaps.length) {
            const gaps = el("div", "gap-list");
            gaps.append(el("strong", "", "证据边界"));
            const list = el("ul", "rubric");
            data.meta.evidenceGaps.forEach(gap => list.append(el("li", "", gap)));
            gaps.append(list);
            root.append(gaps);
          }
          const list = el("ol", "source-list");
          const node = state.backgroundNodeId ? nodeMap.get(state.backgroundNodeId) : null;
          const nodeSources = node ? new Set(node.sourceIds || []) : null;
          const sources = nodeSources
            ? data.sources.filter(source => nodeSources.has(source.id))
            : data.sources;
          sources.forEach(source => {
            const item = el("li", "source-item");
            item.id = `source-${source.id}`;
            item.append(el("h3", "", source.title));
            item.append(el("p", "", `${source.publisher} · ${source.kind}${source.publishedAt ? ` · 发布 ${source.publishedAt}` : ""} · 核验 ${source.accessedAt}`));
            if (source.notes) item.append(el("p", "", source.notes));
            item.append(link(source.url, "打开来源 ↗"));
            list.append(item);
          });
          root.append(list);
          return;
        }
        const items = backgroundItemsFor(tab);
        if (!items.length) {
          root.append(el("p", "empty-state", "这一维度暂无可核验内容。"));
        }
        items.forEach(item => {
          const card = el("article", "background-card");
          if (tab === "people") {
            card.append(el("h3", "", item.name));
            card.append(el("p", "", item.contribution));
            card.append(el("p", "", `协作与背景：${item.context}`));
            card.append(el("p", "", `贡献边界：${item.limits}`));
            card.append(link(item.profileUrl, "可靠人物资料 ↗", "inline-link"));
          } else if (tab === "institutions") {
            card.append(el("h3", "", item.name));
            card.append(el("p", "", item.role));
            card.append(el("p", "", `代表性工作：${item.representativeWork}`));
            card.append(link(item.homepage, "官方主页 ↗", "inline-link"));
          } else {
            card.append(el("h3", "", item.name));
            card.append(el("p", "", item.case));
            card.append(el("p", "", `价值：${item.value}`));
            card.append(el("p", "", `限制：${item.limitations}`));
          }
          root.append(card);
        });
      }

      function renderTimeline(root) {
        const timelineItems = backgroundItemsFor("timeline");
        const controls = el("div", "timeline-controls");
        const types = ["all", ...new Set(timelineItems.map(item => item.eventType))];
        types.forEach(type => {
          const button = el("button", "filter-button", type === "all" ? "全部" : EVENT_LABELS[type] || type);
          button.type = "button";
          button.dataset.timelineFilter = type;
          button.setAttribute("aria-pressed", String(type === state.timelineFilter));
          controls.append(button);
        });
        root.append(controls);
        const list = el("ol", "timeline");
        [...timelineItems]
          .sort((a, b) => a.sortDate.localeCompare(b.sortDate))
          .filter(item => state.timelineFilter === "all" || item.eventType === state.timelineFilter)
          .forEach(item => {
            const li = el("li");
            li.dataset.eventType = item.eventType;
            const button = el("button");
            button.type = "button";
            button.append(
              el("time", "", item.date),
              el("strong", "", item.title)
            );
            const detail = el("div", "timeline-detail");
            detail.append(el("p", "", item.description), el("p", "", `影响：${item.impact}`));
            button.addEventListener("click", () => li.classList.toggle("is-open"));
            li.append(button, detail);
            list.append(li);
          });
        if (!list.childElementCount) root.append(el("p", "empty-state", "这一筛选下没有事件。"));
        else root.append(list);
        controls.addEventListener("click", event => {
          const button = event.target.closest("[data-timeline-filter]");
          if (!button) return;
          state.timelineFilter = button.dataset.timelineFilter;
          renderBackgroundTab();
        });
      }

      function openBackground(tab = "people", focusId = null, nodeId = null) {
        state.backgroundTab = BG_TABS.includes(tab) ? tab : "people";
        const nextNodeId = nodeId && nodeMap.has(nodeId) ? nodeId : null;
        if (state.backgroundNodeId !== nextNodeId) state.timelineFilter = "all";
        state.backgroundNodeId = nextNodeId;
        document.querySelectorAll("[data-background-tab]").forEach(button => {
          button.setAttribute("aria-selected", String(button.dataset.backgroundTab === state.backgroundTab));
        });
        byId("background-dialog").dataset.nodeId = state.backgroundNodeId || "";
        renderBackgroundTab();
        const dialog = byId("background-dialog");
        if (!dialog.open) {
          if (typeof dialog.showModal === "function") dialog.showModal();
          else dialog.setAttribute("open", "");
        }
        if (focusId) {
          requestAnimationFrame(() => document.getElementById(focusId)?.scrollIntoView({ block: "center" }));
        }
      }

      function closeBackground() {
        const dialog = byId("background-dialog");
        if (typeof dialog.close === "function") dialog.close();
        else dialog.removeAttribute("open");
      }

      function setupExport() {
        byId("export-data").addEventListener("click", () => {
          const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json;charset=utf-8" });
          const url = URL.createObjectURL(blob);
          const anchor = document.createElement("a");
          anchor.href = url;
          anchor.download = `${data.meta.slug}.json`;
          document.body.append(anchor);
          anchor.click();
          anchor.remove();
          setTimeout(() => URL.revokeObjectURL(url), 1000);
          showToast("内容 JSON 已导出。");
        });
      }

      let toastTimer;
      function showToast(message) {
        const toast = byId("toast");
        toast.textContent = message;
        toast.classList.add("is-visible");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove("is-visible"), 2200);
      }

      function setupEvents() {
        document.querySelectorAll(".tab-button").forEach(button => {
          button.addEventListener("click", () => {
            state.globalView = null;
            state.tab = button.dataset.tab;
            renderInspector();
          });
        });
        document.querySelectorAll("[data-background-tab]").forEach(button => {
          button.addEventListener("click", () => {
            state.backgroundTab = button.dataset.backgroundTab;
            document.querySelectorAll("[data-background-tab]").forEach(tab => {
              tab.setAttribute("aria-selected", String(tab === button));
            });
            renderBackgroundTab();
          });
        });
        byId("prev-node").addEventListener("click", () => {
          const index = data.chain.nodes.findIndex(node => node.id === state.selectedNodeId);
          if (index > 0) selectNode(data.chain.nodes[index - 1].id);
        });
        byId("next-node").addEventListener("click", () => {
          const index = data.chain.nodes.findIndex(node => node.id === state.selectedNodeId);
          if (index < data.chain.nodes.length - 1) selectNode(data.chain.nodes[index + 1].id);
        });
        byId("hero-next-action").addEventListener("click", () => {
          const index = data.chain.nodes.findIndex(node => node.id === state.selectedNodeId);
          const nextNode = data.chain.nodes[index + 1];
          if (nextNode) selectNode(nextNode.id);
          else {
            state.globalView = null;
            state.quizScope = "node";
            state.quizIndex = 0;
            state.tab = "quiz";
            renderInspector();
            openInspector();
          }
        });
        document.querySelectorAll("[data-global-view]").forEach(button => {
          button.addEventListener("click", () => {
            setGlobalView(button.dataset.globalView);
          });
        });
        byId("background-close").addEventListener("click", closeBackground);
        byId("inspector-close").addEventListener("click", closeInspector);
        byId("background-dialog").addEventListener("click", event => {
          if (event.target === byId("background-dialog")) closeBackground();
        });
        document.addEventListener("keydown", event => {
          if (event.key === "Escape" && document.querySelector(".lab-shell.is-expanded")) {
            closeExpandedLab();
            return;
          }
          if (event.key === "Escape" && byId("inspector").classList.contains("is-open")) {
            closeInspector();
            return;
          }
          const dialog = byId("background-dialog");
          if (dialog.open) return;
          const tag = event.target.tagName;
          if (["INPUT", "TEXTAREA", "SELECT", "BUTTON", "A"].includes(tag)) return;
          const index = data.chain.nodes.findIndex(node => node.id === state.selectedNodeId);
          if (event.key === "ArrowLeft" && index > 0) selectNode(data.chain.nodes[index - 1].id);
          if (event.key === "ArrowRight" && index < data.chain.nodes.length - 1) selectNode(data.chain.nodes[index + 1].id);
        });
      }

      function initialSelection() {
        const hash = decodeURIComponent(window.location.hash.replace(/^#/, ""));
        if (hash === "videos") {
          state.backgroundOnLoad = "videos";
        } else if (hash.startsWith("branch-")) {
          const branch = branchMap.get(hash.slice(7));
          if (branch) {
            state.selectedNodeId = branch.parentId;
            state.selectedBranchId = branch.id;
            state.openBranchNodeId = branch.parentId;
            scrollToInitialNode = true;
          }
        } else if (hash.startsWith("node-")) {
          const node = nodeMap.get(hash.slice(5));
          if (node) {
            state.selectedNodeId = node.id;
            scrollToInitialNode = true;
          }
        }
      }

      window.addEventListener("message", handleLabMessage);
      renderHero();
      initialSelection();
      renderChain();
      updateProgress();
      renderInspector();
      if (scrollToInitialNode) {
        requestAnimationFrame(() => {
          document.querySelector(`.chain-row[data-node-id="${state.selectedNodeId}"]`)?.scrollIntoView({ block: "center" });
        });
      }
      setupEvents();
      setupExport();
      if (state.backgroundOnLoad) openBackground(state.backgroundOnLoad);
      if (window.innerWidth <= 880) closeInspector();
    })();
  </script>
</body>
</html>
