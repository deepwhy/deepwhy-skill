    html[data-style="atlas"][data-theme="dark"] {
      --bg: #1d211d;
      --bg-2: #292c25;
      --surface: rgba(43, 45, 38, 0.96);
      --surface-solid: #303229;
      --surface-hover: #393a30;
      --surface-soft: rgba(230, 244, 231, 0.045);
      --line: rgba(190, 218, 197, 0.17);
      --line-strong: rgba(190, 218, 197, 0.36);

    html[data-style="chronicle"] {

      --surface-soft: rgba(91, 49, 38, 0.06);
      --line: rgba(82, 53, 44, 0.2);
      --line-strong: rgba(82, 53, 44, 0.38);

    html[data-style="chronicle"][data-theme="dark"] {
      --bg: #211b18;

      --surface: rgba(49, 39, 34, 0.96);
      --surface-solid: #392e29;

      --surface-soft: rgba(255, 237, 211, 0.045);

      --line-strong: rgba(237, 208, 175, 0.38);

    html[data-style="fieldnotes"] {
      --bg: #f4f1e7;

      --surface-soft: rgba(48, 79, 70, 0.055);

      --line-strong: rgba(53, 79, 69, 0.36);
      --text: #1c2a26;
      --muted: #52665e;
      --faint: #7c8c84;
      --accent: #197568;
      --accent-2: #d06b42;
      --accent-3: #b88b12;
      --danger: #a7363d;
      --success: #2d7650;
      --radius-xl: 22px;
      --radius-lg: 16px;
      --radius-md: 10px;
      --display: "Avenir Next", "Noto Sans SC", "PingFang SC", sans-serif;
      --body: "Avenir Next", "Noto Sans SC", "PingFang SC", sans-serif;

        radial-gradient(circle, rgba(44, 96, 83, 0.13) 1px, transparent 1.2px);

    html[data-style="fieldnotes"][data-theme="dark"] {
      --bg: #1e231f;
      --bg-2: #292e28;
      --surface: rgba(43, 48, 41, 0.96);
      --surface-solid: #30362f;
      --surface-hover: #3b4038;
      --surface-soft: rgba(234, 248, 236, 0.045);
      --line: rgba(199, 229, 207, 0.17);
      --line-strong: rgba(199, 229, 207, 0.35);
      --text: #f1f6ee;
      --muted: #b5c7bc;
      --faint: #81958a;
      --accent: #6fd4c0;
      --accent-2: #f09a73;
      --accent-3: #e0c16d;
      --danger: #ff9da2;
      --success: #8cdab0;
      --shadow: 0 10px 28px rgba(0, 0, 0, 0.15);
    }

    * { box-sizing: border-box; }
    html {
      scroll-behavior: smooth;
      background: var(--bg);
    }
    body {
      min-width: 320px;
      margin: 0;
      color: var(--text);
      background:
        radial-gradient(circle at 88% 4%, color-mix(in srgb, var(--accent) 9%, transparent), transparent 28%),
        radial-gradient(circle at 8% 96%, color-mix(in srgb, #6ec8e8 7%, transparent), transparent 24%),
        var(--bg);
      font-family: var(--body);
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
    }
    body::before {
      position: fixed;
      inset: 0;
      z-index: -1;
      content: "";
      pointer-events: none;
      background-image: var(--pattern);
      background-size: 18px 18px;
      opacity: 0.5;
    }
    a { color: var(--accent-2); text-underline-offset: 0.18em; }
    a:hover { color: var(--text); }
    button, input, textarea { font: inherit; }
    :focus-visible { outline: 3px solid var(--accent-2); outline-offset: 3px; }
    [hidden] { display: none !important; }

    .skip-link {
      position: fixed;
      top: 10px;
      left: 10px;
      z-index: 200;
      padding: 9px 13px;
      color: var(--bg);
      background: var(--accent-2);
      border-radius: 8px;
      transform: translateY(-160%);
    }
    .skip-link:focus { transform: translateY(0); }

    .app-header {
      position: sticky;
      top: 0;
      z-index: 50;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 16px;
      align-items: center;
      min-height: 64px;
      padding: 0 20px;
      background: color-mix(in srgb, var(--surface-solid) 82%, transparent);
      backdrop-filter: blur(18px) saturate(130%);
      -webkit-backdrop-filter: blur(18px) saturate(130%);
      border-bottom: 1px solid var(--line);
      box-shadow: 0 8px 28px color-mix(in srgb, var(--accent) 5%, transparent);
    }
    html[data-style="chronicle"] .app-header {
      border-top: 5px solid var(--accent);
      border-bottom-width: 2px;
    }
    .brand {
      display: inline-flex;
      gap: 9px;
      align-items: center;
      justify-self: start;
      color: var(--text);
      font-weight: 760;
      letter-spacing: 0.04em;
      text-decoration: none;
    }
    .brand-mark {
      display: grid;
      width: 32px;
      height: 32px;
      place-items: center;
      color: #fff;
      background: linear-gradient(135deg, #8d62ff, #6040d8);
      border-radius: 10px;
      box-shadow: 0 8px 18px rgba(100, 68, 220, 0.22);
    }
    html[data-style="atlas"] .brand-mark,
    html[data-style="chronicle"] .brand-mark { border-radius: 2px; }
    .chain-progress {
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 0.04em;
    }
    .progress-track {
      width: 130px;
      height: 4px;
      overflow: hidden;
      background: var(--surface-soft);
      border-radius: 99px;
    }
    .progress-fill {
      width: 0;
      height: 100%;
      background: var(--accent-2);
      border-radius: inherit;
      transition: width 180ms ease;
    }
    .button {
      min-height: var(--control-height);
      padding: 7px 13px;
      color: var(--text);
      background: color-mix(in srgb, var(--surface-solid) 88%, transparent);
      border: 1px solid var(--line);
      border-radius: var(--control-radius);
      cursor: pointer;
      transition: background 140ms ease, border-color 140ms ease, transform 140ms ease;
    }
    .button:hover {
      background: var(--surface-hover);
      border-color: var(--line-strong);
    }
    .button:active { transform: translateY(1px); }
    .button.primary {
      color: #fff;
      font-weight: 730;
      background: linear-gradient(135deg, #8458ff, #5a52d8);
      border-color: transparent;
      box-shadow: 0 9px 22px rgba(90, 72, 210, 0.25);
    }
    .button.quiet {
      min-height: var(--control-height);
      padding: 7px 12px;
      color: var(--muted);
      font-size: 12px;
    }
    .tab-button,
    .branch-toggle,
    .branch-button,
    .close-button,
    .manim-replay,
    .interaction-option {
      min-height: var(--control-height);
      border-radius: var(--control-radius);
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(560px, 44fr) minmax(620px, 56fr);
      gap: 16px;
      width: 100%;
      height: calc(100dvh - 64px);
      min-height: 0;
      margin: 0;
      padding: 16px 20px 20px;
      overflow: hidden;
      align-items: stretch;
    }
    @media (min-width: 881px) {
      body { overflow: hidden; }
    }
    .chain-stage {
      min-width: 0;
      height: 100%;
      padding: 16px 18px 28px;
      overflow: auto;
      background-color: color-mix(in srgb, var(--surface-solid) 88%, transparent);
      background-image: radial-gradient(
        circle,
        color-mix(in srgb, var(--accent) 14%, transparent) 1px,
        transparent 1.1px
      );
      background-size: 22px 22px;
      border: 1px solid var(--line);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      scrollbar-width: thin;
    }
    .hero {
      position: relative;
      overflow: hidden;
      padding: 17px;
      background: transparent;
      border: 0;
      border-bottom: 1px solid var(--line);
      border-radius: 0;
      box-shadow: none;
    }
    html[data-style="atlas"] .hero { border-top: 4px solid var(--accent); }
    html[data-style="chronicle"] .hero {
      border-top: 8px double var(--accent);
      background: var(--surface);
    }
    html[data-style="fieldnotes"] .hero {
      border-left: 5px solid var(--accent);
    }
    .hero-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 15px;
      align-items: start;
    }
    .hero-copy { min-width: 0; }
    .opening-figure-placeholder {
      min-height: 150px;
      margin: 0;
      background: color-mix(in srgb, var(--surface-soft) 55%, transparent);
      border: 1px solid var(--line);
    }
    .opening-visual {
      min-width: 0;
      margin: 0;
      overflow: hidden;
      background: color-mix(in srgb, var(--surface-soft) 55%, var(--surface-solid));
      border: 1px solid var(--line);
    }
    .hero .opening-visual svg,
    .hero .opening-visual img {
      display: block;
      width: 100%;
      height: 124px;
      max-height: 124px;
      object-fit: contain;
    }
    .hero .opening-visual figcaption {
      max-height: 48px;
      overflow: hidden;
      padding: 7px 9px;
      color: var(--faint);
      font-size: 9px;
      line-height: 1.55;
      border-top: 1px solid var(--line);
    }
    .hero .motion-replay {
      min-height: 28px;
      margin: 6px 9px 8px;
      padding: 4px 8px;
      font-size: 10px;
    }
    .eyebrow, .node-type, .card-kicker, .tab-button, .mini-label {
      color: var(--accent);
      font-size: 10px;
      font-weight: 760;
      letter-spacing: 0.11em;
      text-transform: uppercase;
    }
    .eyebrow {
      display: inline-flex;
      gap: 8px;
      align-items: center;
      margin: 0 0 12px;
    }
    .eyebrow::before {
      display: none;
    }
    h1 {
      max-width: 330px;
      margin: 0;
      font-family: var(--display);
      font-size: clamp(27px, 2.15vw, 36px);
      font-weight: 760;
      letter-spacing: -0.035em;
      line-height: 1.08;
      text-wrap: balance;
    }
    html[data-style="chronicle"] h1 {
      font-weight: 600;
      letter-spacing: -0.025em;
    }
    html[data-style="atlas"] h1 {
      font-weight: 650;
      letter-spacing: -0.035em;
    }
    .opening {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      align-items: start;
      margin-top: 13px;
    }
    .opening p {
      max-width: 330px;
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.65;
    }
    .opening strong {
      display: block;
      margin-top: 5px;
      color: var(--text);
      font-weight: 660;
    }
    .key-insight {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 14px;
      align-items: baseline;
      max-width: 860px;
      margin: 12px 0 0;
      padding: 9px 0;
      color: var(--text);
      font-size: 12px;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }
    .key-insight span {
      color: var(--accent-2);
      font-family: var(--mono);
      font-size: 9px;
      font-weight: 760;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    .key-insight strong { font-weight: 620; line-height: 1.55; }
    .journey-actions {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px 10px;
      align-items: center;
      margin-top: 10px;
      color: var(--faint);
      font-size: 11px;
    }
    #journey-position {
      grid-column: 1 / -1;
      color: var(--accent);
      font-family: var(--mono);
      font-size: 10px;
      white-space: nowrap;
    }
    #next-action-copy {
      min-width: 0;
      color: var(--muted);
      line-height: 1.5;
    }
    .journey-actions .button {
      grid-column: 2;
      grid-row: 2;
      align-self: center;
    }
    .chain-count {
      display: inline-flex;
      gap: 6px;
      align-items: center;
      padding: 5px 8px;
      color: var(--accent);
      font-family: var(--mono);
      font-size: 10px;
      white-space: nowrap;
      background: color-mix(in srgb, var(--accent) 8%, transparent);
      border: 1px solid color-mix(in srgb, var(--accent) 22%, var(--line));
      border-radius: 2px;
    }
    .premise-notice {
      margin-top: 16px;
      padding: 11px 13px;
      color: var(--muted);
      font-size: 12px;
      background: color-mix(in srgb, var(--accent-3) 9%, transparent);
      border-left: 3px solid var(--accent-3);
    }
    .premise-notice strong { color: var(--text); }
    .evidence-button {
      padding: 0;
      color: var(--accent-3);
      font-size: 12px;
      background: transparent;
      border: 0;
      border-bottom: 1px dotted currentColor;
      cursor: pointer;
    }

    .chain-toolbar {
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      margin: 15px 2px 8px;
      color: var(--faint);
      font-size: 11px;
    }
    html[data-style="chronicle"] .chain-toolbar {
      border-bottom: 1px solid var(--line-strong);
      padding-bottom: 7px;
    }
    .chain-toolbar strong { color: var(--muted); font-weight: 680; }
    .chain-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 7px 12px;
      margin: 0 2px 11px;
      color: var(--faint);
      font-size: 9px;
    }
    .chain-legend-item {
      display: inline-flex;
      gap: 5px;
      align-items: center;
    }
    .chain-legend-dot {
      width: 7px;
      height: 7px;
      flex: 0 0 auto;
      border-radius: 50%;
      background: var(--legend-color, var(--accent));
    }
    .global-switcher {
      display: flex;
      gap: 5px;
      align-items: center;
      justify-self: end;
      min-width: 0;
      padding: 5px;
      overflow-x: auto;
      background: color-mix(in srgb, var(--accent) 6%, var(--surface-solid));
      border: 1px solid color-mix(in srgb, var(--accent) 24%, var(--line));
      border-radius: 12px;
      box-shadow: 0 6px 18px color-mix(in srgb, var(--accent) 6%, transparent);
      scrollbar-width: none;
    }
    .global-switcher::-webkit-scrollbar { display: none; }
    .global-switcher > span {
      flex: none;
      padding: 5px 8px;
      color: var(--accent);
      font-family: var(--mono);
      font-size: 9px;
      font-weight: 760;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      background: color-mix(in srgb, var(--accent) 10%, var(--surface-solid));
      border-radius: 8px;
    }
    .global-switcher button {
      flex: none;
      min-height: 32px;
      padding: 5px 10px;
      color: var(--text);
      font-size: 11px;
      font-weight: 620;
      background: var(--surface-solid);
      border: 1px solid var(--line);
      border-radius: var(--control-radius);
      cursor: pointer;
      transition: color 140ms ease, background 140ms ease, border-color 140ms ease;
    }
    .global-switcher button:hover {
      color: var(--accent);
      background: color-mix(in srgb, var(--accent) 8%, var(--surface-solid));
      border-color: color-mix(in srgb, var(--accent) 42%, var(--line));
    }
    .global-switcher button[aria-pressed="true"] {
      color: #fff;
      background: var(--accent);
      border-color: var(--accent);
      box-shadow: 0 5px 14px color-mix(in srgb, var(--accent) 28%, transparent);
    }

    .knowledge-chain {
      position: relative;
      display: grid;
      gap: 0;
      padding: 4px 0 2px;
    }
    .chain-row {
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(300px, 356px) minmax(0, 1fr);

      color: var(--text);

      border: 1px solid var(--line-strong);
      border-radius: 24px;
      box-shadow: 0 18px 50px rgba(24, 25, 20, 0.22);

      background: rgba(24, 25, 20, 0.62);
    }

      display: flex;
      flex-direction: column;
      max-height: min(860px, calc(100vh - 30px));
    }
    .dialog-head {
      display: flex;

      padding: 20px 22px 14px;

      border: 1px solid var(--line);
      border-radius: var(--control-radius);

      gap: 6px;

      padding: 4px 8px;

      background: transparent;
      border: 1px solid var(--line);
      border-radius: var(--control-radius);

      padding: 0;
      list-style: none;
    }

      position: relative;
      padding: 0 0 13px 19px;
    }

      position: absolute;
      top: 5px;
      left: 1px;
      width: 8px;
      height: 8px;
      content: "";
      background: var(--surface-solid);
      border: 2px solid var(--accent);
      border-radius: 50%;

    .timeline li::after {
      position: absolute;

      content: "";

      background: transparent;
      border: 0;
      cursor: pointer;

      font-size: 9px;
      letter-spacing: 0.06em;

    }

      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 100;
      max-width: 340px;
      padding: 10px 13px;
      color: var(--text);
      font-size: 12px;
      background: var(--surface-solid);
      border: 1px solid var(--line-strong);
      border-radius: 2px;
      box-shadow: var(--shadow);

      pointer-events: none;

      transition: opacity 150ms ease, transform 150ms ease;

    @media (max-width: 1200px) {

        grid-template-columns: minmax(410px, 44fr) minmax(0, 56fr);
        gap: 12px;
        padding: 12px;
      }

      .node-stack,
      .branch-rail.left,
      .branch-rail.right { grid-column: auto; }

        padding: 0 8px;
      }

      .branch-rail.right { align-items: stretch; justify-content: flex-start; }
      .branch-button { max-width: none; flex: 1 1 150px; }

        grid-template-columns: 1fr;

        padding: 8px 14px;

      }

      }
      .hero-grid { grid-template-columns: 1fr; }
      .opening-figure-placeholder { min-height: 0; }
      .journey-actions { grid-template-columns: 1fr; align-items: start; }
      #journey-position { grid-column: auto; }

        bottom: 8px;
        left: 8px;
        z-index: 80;
        top: auto;
        height: auto;
        max-height: 78vh;
        border-radius: 4px;
        transform: translateY(calc(100% + 20px));
        visibility: hidden;
        transition: transform 180ms ease, visibility 180ms ease;
      }

        transform: translateY(0);
        visibility: visible;
      }

        grid-template-columns: 1fr;
        gap: 7px;
      }

      .branch-rail {
        flex-direction: row;
        flex-wrap: wrap;
        padding: 0 8px;
        opacity: 1;
        pointer-events: auto;
      }
      .branch-rail.left,
      .branch-rail.right { align-items: stretch; justify-content: flex-start; }
      .chain-row:not([data-selected="true"]) .branch-rail { display: none; }
      .branch-rail:empty { display: none; }
      .branch-button { max-width: none; flex: 1 1 140px; }
      .branch-button::after { display: none; }
      .chain-connector { height: 25px; }
      body.inspector-open { overflow: hidden; }
      .lab-shell.is-expanded { inset: 0; border-radius: 0; }
      .lab-head { flex-wrap: wrap; }
      .lab-frame-wrap { min-height: 300px; }
      .opening { grid-template-columns: 1fr; align-items: start; }
      .chain-count { justify-self: start; }
    }

    @media (max-width: 520px) {
      .brand span:last-child { display: none; }
      .hero { padding: 21px 17px; }
      .hero .opening-visual figcaption { display: none; }
      .chain-completion { padding: 16px; }
      .node-card { padding: 14px; }
      .node-question { font-size: 16px; }
      .dialog-head { padding: 17px 17px 12px; }
      .dialog-tabs { padding-left: 12px; padding-right: 12px; }
      .dialog-body { padding: 15px 17px; }
      .dialog-footer { padding: 12px 17px 16px; }
      .inspector-head { padding: 15px 16px 12px; }
      .tabs { padding-left: 10px; padding-right: 10px; }
      .inspector-body { padding: 15px 16px 18px; }
      .inspector-nav { padding: 11px 16px 15px; }
      .metrics { grid-template-columns: 1fr; }
      .video-grid { grid-template-columns: 1fr; }
      .video-thumbnails { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .global-video-library { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .key-insight { grid-template-columns: 1fr; gap: 4px; }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after {
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
      }
    }

    @media print {
      .app-header, .branch-rail, .inspector-nav, .tabs, .completion-actions, .toast, dialog { display: none !important; }
      body { color: #111; background: #fff; }
      body::before { display: none; }
      .workspace { display: block; width: 100%; }
      .hero, .node-card, .chain-completion, .inspector { color: #111; background: #fff; box-shadow: none; border-color: #bbb; }

      .disclosure[open] .disclosure-body { display: block; }

l=\"#e9e7f1\"/>\n  <path d=\"M132 344 C130 246 136 143 162 78\" fill=\"none\" stroke=\"#71523f\" stroke-width=\"17\" stroke-linecap=\"round\"/>\n  <path d=\"M152 166 C110 132 86 117 58 117 M157 142 C200 103 255 92 303 79\" fill=\"none\" stroke=\"#71523f\" stroke-width=\"8\" stroke-linecap=\"round\"/>\n  <g fill=\"#8aa27c\"><circle cx=\"58\" cy=\"116\" r=\"38\"/><circle cx=\"102\" cy=\"129\" r=\"31\"/><circle cx=\"254\" cy=\"91\" r=\"42\"/><circle cx=\"300\" cy=\"79\" r=\"30\"/><circle cx=\"161\" cy=\"122\" r=\"38\"/><\/g>\n  <g fill=\"#c34f43\"><circle cx=\"90\" cy=\"151\" r=\"12\"/><circle cx=\"219\" cy=\"124\" r=\"13\"/><circle cx=\"279\" cy=\"107\" r=\"11\"/><\/g>\n  <g>\n    <circle cx=\"464\" cy=\"142\" r=\"18\" fill=\"#c34f43\"/>\n    <path d=\"M464 124 C468 111 478 106 489 104\" fill=\"none\" stroke=\"#49603c\" stroke-width=\"4\"/>\n    <animateTransform attributeName=\"transform\" type=\"translate\" values=\"0 0;0 157;0 157\" keyTimes=\"0;0.74;1\" dur=\"3.4s\" repeatCount=\"indefinite\"/>\n  <\/g>\n  <path d=\"M464 167 Q456 231 463 305\" fill=\"none\" stroke=\"#b94b40\" stroke-width=\"3\" stroke-dasharray=\"8 7\"/>\n  <path d=\"M455 293 L463 307 L472 294\" fill=\"none\" stroke=\"#b94b40\" stroke-width=\"3\"/>\n  <circle cx=\"464\" cy=\"355\" r=\"29\" fill=\"#e7e2d7\"/>\n  <circle cx=\"464\" cy=\"355\" r=\"5\" fill=\"#7a3b35\"/>\n  <path d=\"M300 363 L300 335\" stroke=\"#5b5bd6\" stroke-width=\"3\"/>\n  <path d=\"M291 344 L300 331 L309 344\" fill=\"none\" stroke=\"#5b5bd6\" stroke-width=\"3\"/>\n  <text x=\"472\" y=\"75\" font-family=\"system-ui,sans-serif\" font-size=\"21\" font-weight=\"700\" fill=\"#27324a\">苹果向下加速<\/text>\n  <text x=\"188\" y=\"382\" font-family=\"system-ui,sans-serif\" font-size=\"18\" fill=\"#59627a\">地球同时被向上拉一点点<\/text>\n  <text x=\"540\" y=\"360\" font-family=\"system-ui,sans-serif\" font-size=\"17\" fill=\"#737b91\">日常只看见苹果明显移动<\/text>\n<\/svg>","src":null,"alt":"苹果离开树枝后向下加速，同时地球受到方向相反的极小拉力。","caption":"主视觉先呈现可见的落下，再用向上箭头提示容易被忽略的地球反作用。","formula":null,"sourceIds":["openstax-gravity","sep-principia"],"interaction":null},"nodes":[{"id":"n1","parentId":null,"type":"phenomenon","concept":"看见下落","question":"苹果离开枝头后，为什么会一直朝地面加速？","answer":"地球持续把苹果拉向地面，所以松手后苹果越落越快。","analogy":"松手的水杯也会向地面加速；这个熟悉的动作比单看一枚苹果更普遍。","guide":{"bridge":"先只保留亲眼看见的部分：苹果原来挂在树上，松手后才向下走。","plainLanguage":"树枝托着苹果时，它停在那里；树枝一松开，地球的吸引就让苹果向下跑，而且速度越来越快。","steps":["苹果挂在枝头时，树枝托住了它。","苹果离开树枝后，不再有树枝托住它。","地球的吸引持续朝地面方向作用。","苹果每个时刻都增加一点向下速度。"],"check":{"prompt":"苹果刚离开枝头时还不快，为什么随后会越落越快？","answer":"因为向下的吸引没有消失，它让苹果持续获得更多向下速度。"}},"status":"complete","sourceIds":["openstax-gravity","sep-principia"],"detail":{"deepDive":"苹果离枝后，空气阻力仍然存在，但它不是苹果向下运动的首要原因。先忽略空气阻力，可以看见地球吸引造成的向下加速度；真实落体则还要考虑阻力、形状和空气流动。","whyItMatters":"现象层只回答“看见了什么”。若直接跳到弯曲时空，会省略质量、距离和相互作用这些中间台阶。","experimentOrProof":"OpenStax 从物体为什么会自然落向地面引入万有引力；历史资料则提醒我们，苹果故事是叙事入口，不是完整实验记录。","frontier":""},"diagram":null,"videoIds":["n1-video-1","n1-video-2","n1-video-3","n1-video-4","n1-video-5"],"branches":[{"id":"n1-b1","type":"mechanism","question":"没有空气时，苹果会怎样下落？","answer":"空气阻力消失后，物体更接近只受引力控制的自由落体。","sourceIds":["openstax-gravity"]},{"id":"n1-b2","type":"theory","question":"牛顿真的只因为看到苹果就发现了引力吗？","answer":"苹果故事是著名叙事，万有引力却来自长期观测、数学推导与多人积累。","sourceIds":["sep-principia"]}],"lab":null},{"id":"n2","parentId":null,"type":"mechanism","concept":"互相拉","question":"地球和苹果，到底是谁在拉谁？","answer":"两者互相吸引；苹果动得多，只因它比地球轻得多。","analogy":"地球像轮椅上的大人，苹果像小孩；双方拉同一根绳，小孩会明显靠近大人。","guide":{"bridge":"上一层看见苹果向下。现在把地球与苹果换成大人和小孩，就能看见方向相反的一对拉力。","plainLanguage":"大人和小孩拉同一根绳时，绳子不会只拉一个人。它同时把双方拉向中间；较轻的小孩更容易改变速度。","steps":["把地球看作质量很大的大人，把苹果看作小孩。","双方共享同一根绳，所以受到大小相同、方向相反的拉力。","同样的拉力下，小孩的加速度更大。","映射回现实：苹果明显下落，地球只发生极小的反向运动。"],"check":{"prompt":"如果苹果也拉地球，为什么日常只看见苹果向下？","answer":"苹果质量小，同样拉力就能产生明显加速度；地球质量极大，所以运动小到几乎无法察觉。"}},"status":"complete","sourceIds":["openstax-gravity","einstein-online-gravity"],"detail":{"deepDive":"在地球—苹果系统中，两个物体受到的引力大小相等、方向相反。加速度还与质量有关：地球的加速度等于这个力除以地球质量，因此远小于苹果的加速度。绳子只是帮助看见共同拉力，并不表示宇宙中真有一根绳。","whyItMatters":"把下落说成“地球单方面拉苹果”会漏掉相互性，也容易把重量和质量混为一谈。","experimentOrProof":"牛顿定律同时适用于地面落体和天体轨道。关键不是物体的大小，而是同一对相互作用如何改变双方运动。","frontier":""},"diagram":{"mode":"svg","kind":"force","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 700 330\">\n  <rect width=\"700\" height=\"330\" fill=\"#f6f7fc\"/>\n  <text x=\"350\" y=\"38\" text-anchor=\"middle\" font-family=\"system-ui,sans-serif\" font-size=\"20\" font-weight=\"700\" fill=\"#27324a\">同一根绳，两个方向相反的拉力<\/text>\n  <circle cx=\"165\" cy=\"169\" r=\"78\" fill=\"#e7e7ff\" stroke=\"#5b5bd6\" stroke-width=\"4\"/>\n  <text x=\"165\" y=\"176\" text-anchor=\"middle\" font-family=\"system-ui,sans-serif\" font-size=\"20\" font-weight=\"700\" fill=\"#27324a\">地球<\/text>\n  <circle cx=\"516\" cy=\"137\" r=\"25\" fill=\"#ffe2dd\" stroke=\"#d95c4b\" stroke-width=\"4\"/>\n  <text x=\"516\" y=\"143\" text-anchor=\"middle\" font-family=\"system-ui,sans-serif\" font-size=\"15\" font-weight=\"700\" fill=\"#27324a\">苹果<\/text>\n  <path d=\"M246 158 L482 132\" stroke=\"#5b5bd6\" stroke-width=\"4\"/>\n  <path d=\"M482 132 L448 118 L451 146Z\" fill=\"#5b5bd6\"/>\n  <path d=\"M492 161 L258 188\" stroke=\"#d95c4b\" stroke-width=\"4\"/>\n  <path d=\"M258 188 L292 174 L289 202Z\" fill=\"#d95c4b\"/>\n  <text x=\"350\" y=\"235\" text-anchor=\"middle\" font-family=\"system-ui,sans-serif\" font-size=\"18\" fill=\"#4d5870\">大小相同<\/text>\n  <text x=\"350\" y=\"265\" text-anchor=\"middle\" font-family=\"system-ui,sans-serif\" font-size=\"18\" fill=\"#4d5870\">质量不同，所以加速度不同<\/text>\n  <text x=\"165\" y=\"280\" text-anchor=\"middle\" font-family=\"system-ui,sans-serif\" font-size=\"16\" fill=\"#737b91\">地球移动极小<\/text>\n  <text x=\"516\" y=\"205\" text-anchor=\"middle\" font-family=\"system-ui,sans-serif\" font-size=\"16\" fill=\"#b64c3f\">苹果移动明显<\/text>\n<\/svg>","src":null,"alt":"地球与苹果之间的两个箭头大小相同、方向相反，但标注的移动幅度不同。","caption":"箭头表达同一对相互作用；两者移动幅度不同，原因在质量。","formula":null,"sourceIds":["openstax-gravity","einstein-online-gravity"],"interaction":{"kind":"prediction","prompt":"如果苹果也拉地球，松手后最可能看到什么？","options":[{"label":"只有苹果移动，地球完全不受影响","feedback":"地球其实也受力，只是质量太大，运动小到日常难以看见。"},{"label":"双方相互靠近，苹果动得多、地球几乎不动","feedback":"正确。同一对拉力同时作用，质量决定谁更容易被推动。"},{"label":"地球会像苹果一样明显向中间移动","feedback":"方向对，但地球质量极大，同样拉力造成的加速度非常小。"}],"correctIndex":1}},"videoIds":["n2-video-1","n2-video-2","n2-video-3","n2-video-4","n2-video-5"],"branches":[{"id":"n2-b1","type":"mechanism","question":"为什么苹果不会把地球拉得明显移动？","answer":"在相同作用力下，质量越大的物体加速度越小，地球因此几乎不动。","sourceIds":["openstax-gravity"]}],"lab":{"kind":"simulation","title":"拉动两边，观察谁移动得更明显","goal":"改变大人和小孩的质量，比较同一根绳带来的不同运动。","html":"<!doctype html>\n<html lang=\"zh-CN\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<style>\nbody{margin:0;padding:16px;background:var(--lab-bg);color:var(--lab-text);font-family:var(--lab-sans)}\n#lab-root{display:grid;gap:12px}\n.stage{position:relative;min-height:190px;overflow:hidden;border:1px solid var(--lab-border);border-radius:14px;background:linear-gradient(var(--lab-surface),color-mix(in srgb,var(--lab-accent) 7%,var(--lab-bg)))}\n.chair{position:absolute;bottom:42px;display:grid;place-items:center;border:2px solid var(--lab-accent);border-radius:50% 50% 42% 42%;background:color-mix(in srgb,var(--lab-accent) 8%,#fff);color:var(--lab-text);font-weight:700}\n#giant{left:17%;width:86px;height:86px}\n#tug{left:20%;right:20%;bottom:32px;height:2px;background:var(--lab-accent-2);position:absolute}\n#child{right:17%;width:46px;height:46px;background:var(--lab-accent-2);color:#fff}\n.labels{position:absolute;left:12px;right:12px;bottom:8px;display:flex;justify-content:space-between;color:var(--lab-muted);font-size:12px}\n.controls{display:grid;grid-template-columns:1fr 1fr;gap:12px}\nlabel{display:grid;gap:6px;font-size:12px;color:var(--lab-muted)}\ninput{width:100%;accent-color:var(--lab-accent)}\n.actions{display:flex;gap:8px;flex-wrap:wrap}\nbutton{min-height:44px;padding:9px 14px;border:1px solid var(--lab-border);border-radius:999px;background:var(--lab-surface);color:var(--lab-text);cursor:pointer}\nbutton.primary{background:var(--lab-accent);color:#fff;border-color:var(--lab-accent)}\n#lab-state,#lab-feedback{margin:0;padding:10px 12px;border-radius:10px;background:var(--lab-surface);font-size:13px;line-height:1.6}\n@media(max-width:520px){.controls{grid-template-columns:1fr}.stage{min-height:170px}}\n@media(prefers-reduced-motion:reduce){*{transition:none!important}}\n<\/style>\n<\/head>\n<body>\n<main id=\"lab-root\">\n  <section class=\"stage\" aria-label=\"坐在轮椅上的大人和小孩拉同一根绳\">\n    <div id=\"tug\"><\/div>\n    <div id=\"giant\" class=\"chair\">地球<br>大人<\/div>\n    <div id=\"child\" class=\"chair\">苹果<br>小孩<\/div>\n    <div class=\"labels\"><span>质量大，移动少<\/span><span>质量小，移动多<\/span><\/div>\n  <\/section>\n  <div class=\"controls\">\n    <label>大人相对质量 <strong id=\"giant-value\">6<\/strong><input id=\"giant-mass\" type=\"range\" min=\"1\" max=\"10\" value=\"6\"><\/label>\n    <label>小孩相对质量 <strong id=\"child-value\">1<\/strong><input id=\"child-mass\" type=\"range\" min=\"1\" max=\"10\" value=\"1\"><\/label>\n  <\/div>\n  <div class=\"actions\">\n    <button id=\"run\" class=\"primary\" type=\"button\">开始实验<\/button>\n    <button id=\"lab-reset\" type=\"button\">重新开始<\/button>\n  <\/div>\n  <p id=\"lab-state\" aria-live=\"polite\">设定两人的质量，然后开始拉绳。<\/p>\n  <p id=\"lab-feedback\" aria-live=\"polite\">同一根绳提供相同拉力；质量决定谁更容易被拉动。<\/p>\n<\/main>\n<script>\nconst giantInput=document.querySelector('#giant-mass');\nconst childInput=document.querySelector('#child-mass');\nconst giant=document.querySelector('#giant');\nconst child=document.querySelector('#child');\nconst run=document.querySelector('#run');\nlet state={giant:6,child:1,elapsed:0,running:false,complete:false};\nlet raf=0,last=0;\nfunction publish(){\n  window.parent.postMessage({source:'deepwhy-lab',type:'state',complete:state.complete,summary:state.complete?'实验完成：小孩移动得更明显。':'当前质量比为 '+state.giant+':'+state.child,state:{...state}}, '*');\n}\nfunction render(){\n  const ratio=state.elapsed/1.8;\n  const giantMove=Math.min(18,34*ratio/state.giant);\n  const childMove=Math.min(110,180*ratio/state.child);\n  giant.style.transform='translateX('+giantMove+'px)';\n  child.style.transform='translateX('+(-childMove)+'px)';\n  document.querySelector('#giant-value').textContent=state.giant;\n  document.querySelector('#child-value').textContent=state.child;\n  run.textContent=state.complete?'再做一次':state.running?'暂停实验':'继续实验';\n  document.querySelector('#lab-state').textContent=state.complete\n    ?'大人移动 '+(18/state.giant).toFixed(1)+' 格，小孩移动 '+(110/state.child).toFixed(1)+' 格。'\n    :state.running?'拉力相同，两人正一起向中间移动。':'设定质量并开始实验。';\n  document.querySelector('#lab-feedback').textContent=state.complete\n    ?'同样的拉力下，质量越小，加速度越大。把这一点映射回地球和苹果。'\n    :'比较质量差别，预测谁移动得更远。';\n}\nfunction tick(now){\n  if(!state.running)return;\n  if(!last)last=now;\n  state.elapsed=Math.min(1.8,state.elapsed+(now-last)/1000);\n  last=now;\n  if(state.elapsed>=1.8){\n    state.running=false;state.complete=true;raf=0;render();publish();return;\n  }\n  render();\n  raf=requestAnimationFrame(tick);\n}\nfunction reset(){\n  cancelAnimationFrame(raf);raf=0;last=0;\n  state={giant:Number(giantInput.value),child:Number(childInput.value),elapsed:0,running:false,complete:false};\n  render();publish();\n}\ngiantInput.addEventListener('input',()=>{state.giant=Number(giantInput.value);reset()});\nchildInput.addEventListener('input',()=>{state.child=Number(childInput.value);reset()});\nrun.addEventListener('click',()=>{\n  if(state.complete){state.elapsed=0;state.complete=false;}\n  state.running=!state.running;last=0;render();publish();\n  if(state.running)raf=requestAnimationFrame(tick);\n});\ndocument.querySelector('#lab-reset').addEventListener('click',reset);\nrender();publish();\n<\/script>\n<\/body>\n<\/html>","height":470,"fallbackText":"如果实验无法运行，请记住：同一对拉力下，质量越小，加速度越明显。","completionText":"地球与苹果互相拉；苹果更轻，因此同样的拉力让它动得更明显。","reflectionPrompt \"700\" fill=\"#1f2937\">同样的拉力<\/text>\n  <circle cx=\"250\" cy=\"260\" r=\"112\" fill=\"#e7e7ff\" stroke=\"#5b5bd6\" stroke-width=\"4\"/>\n  <text x=\"250\" y=\"270\" text-anchor=\"middle\" font-family=\"system-ui,sans-serif\" font-size=\"25\" font-weight=\"700\" fill=\"#1f2937\">地球<\/text>\n  <circle cx=\"620\" cy=\"260\" r=\"38\" fill=\"#ffe2dd\" stroke=\"#d95c4b\" stroke-width=\"4\"/>\n  <text x=\"620\" y=\"270\" text-anchor=\"middle\" font-family=\"system-ui,sans-serif\" font-size=\"20\" font-weight=\"700\" fill=\"#1f2937\">苹果<\/text>\n  <path d=\"M362 260 L582 260\" stroke=\"#7c8cf8\" stroke-width=\"6\"/>\n  <path d=\"M362 260 L410 242 L410 278 Z\" fill=\"#5b5bd6\"/>\n  <path d=\"M582 260 L534 242 L534 278 Z\" fill=\"#d95c4b\"/>\n  <text x=\"250\" y=\"414\" text-anchor=\"middle\" font-family=\"system-ui,sans-serif\" font-size=\"21\" fill=\"#4b5563\">质量大：移动很少<\/text>\n  <text x=\"620\" y=\"354\" text-anchor=\"middle\" font-family=\"system-ui,sans-serif\" font-size=\"21\" fill=\"#b4493c\">质量小：移动更多<\/text>\n<\/svg>\n"}},{"id":"n3","parentId":null,"type":"principle","concept":"远近与轻重","question":"什么会让苹果和地球之间的吸引更强？","answer":"质量越大、距离越近，这种相互吸引就越强。","analogy":"还是轮椅拉绳，但把双方换成装沙袋的小车：沙袋越多，拉得越紧；两车越远，拉力越快变弱。","guide":{"bridge":"上一层已经知道双方互相拉。现在加入两个旋钮：双方的质量，以及它们之间的距离。","plainLanguage":"增加任何一方的质量，会增强吸引；拉远距离，会削弱吸引，而且距离每增加一点，削弱得比直觉更快。","steps":["先把苹果质量加倍，观察它受到的吸引如何变化。","再把地球质量加倍，发现另一端也会让吸引变大。","保持质量不变，把双方距离加倍。","结果不是减半，而是只剩原来的四分之一。"],"check":{"prompt":"距离从 1 变成 3，其他条件不变，相对引力大约变成多少？","answer":"约变成 1/9；距离平方反比意味着 1 除以 3 的平方。"}},"status":"complete","sourceIds":["openstax-gravity"],"detail":{"deepDive":"牛顿万有引力定律写成 F = G·m₁·m₂/r²。两个质量相乘决定“有多少东西在参与吸引”，距离平方放在分母，表示距离影响非常迅速。它是弱场、低速下极其成功的模型。","whyItMatters":"只看质量会误以为越重就越快落下；在忽略空气阻力时，不同质量物体的加速度都由同一个引力关系支配，但彼此施加的力仍与双方质量有关。","experimentOrProof":"从地面落体到月球轨道，牛顿模型都能把看似不同的运动放进同一套定量关系。","frontier":""},"diagram":{"mode":"svg","kind":"equation","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 760 350\">\n  <rect width=\"760\" height=\"350\" fill=\"#f6f7fc\"/>\n  <text x=\"380\" y=\"38\" text-anchor=\"middle\" font-family=\"system-ui,sans-serif\" font-size=\"21\" font-weight=\"700\" fill=\"#27324a\">质量让拉力变大，距离让拉力迅速变小<\/text>\n  <circle cx=\"132\" cy=\"157\" r=\"70\" fill=\"#e7e7ff\" stroke=\"#5b5bd6\" stroke-width=\"4\"/>\n  <circle cx=\"610\" cy=\"157\" r=\"24\" fill=\"#ffe2dd\" stroke=\"#d95c4b\" stroke-width=\"4\"/>\n  <path d=\"M205 157 L582 157\" stroke=\"#8b8be8\" stroke-width=\"4\" stroke-dasharray=\"9 8\"/>\n  <path d=\"M582 157 L548 143 L551 171Z\" fill=\"#8b8be8\"/>\n  <path d=\"M205 177 L239 191 L236 163Z\" fill=\"#8b8be8\"/>\n  <text x=\"393\" y=\"118\" text-anchor=\"middle\" font-family=\"system-ui,sans-serif\" font-size=\"18\" fill=\"#4d5870\">距离 r<\/text>\n  <path d=\"M132 254 L610 254\" stroke=\"#c3c8d8\" stroke-width=\"2\"/>\n  <path d=\"M132 245 L132 263 M610 245 L610 263\" stroke=\"#c3c8d8\" stroke-width=\"3\"/>\n  <text x=\"380\" y=\"286\" text-anchor=\"middle\" font-family=\"system-ui,sans-serif\" font-size=\"18\" fill=\"#4d5870\">距离变成 2 倍，拉力只剩 1/4<\/text>\n  <text x=\"132\" y=\"315\" text-anchor=\"middle\" font-family=\"system-ui,sans-serif\" font-size=\"16\" fill=\"#737b91\">地球质量大<\/text>\n  <text x=\"610\" y=\"315\" text-anchor=\"middle\" font-family=\"system-ui,sans-serif\" font-size=\"16\" fill=\"#737b91\">苹果质量小<\/text>\n<\/svg>","src":null,"alt":"地球和苹果之间标出距离，并说明距离加倍时引力只剩四分之一。","caption":"图只表达质量与距离两个变量；公式是这些关系经过测量和推导后的简写。","formula":"F = G · m₁ · m₂ / r²","sourceIds":["openstax-gravity"],"interaction":{"kind":"inverse-square","prompt":"把地球和苹果的距离拉开，观察拉力怎样变化。","label":"相对距离","min":1,"max":4,"step":0.1,"initial":1,"resultTemplate":"距离 = {value} 倍 → 相对拉力 = {inverseSquare}"}},"videoIds":["n3-video-1","n3-video-2","n3-video-3","n3-video-4","n3-video-5"],"branches":[{"id":"n3-b1","type":"principle","question":"为什么重的物体没有因为受更大引力而必然落得更快？","answer":"引力随质量增大，但惯性也随质量增大，两种变化在自由落体中相互抵消。","sourceIds":["openstax-gravity"]}],"lab":{"kind":"diagram","title":"把距离拉远，追踪引力怎样缩小","goal":"沿曲线比较近处与远处的引力，发现距离平方反比的效果。","html":"<!doctype html>\n<html lang=\"zh-CN\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<style>\nbody{margin:0;padding:16px;background:var(--lab-bg);color:var(--lab-text);font-family:var(--lab-sans)}\n#lab-root{display:grid;gap:12px}\n.chart{border:1px solid var(--lab-border);border-radius:14px;background:var(--lab-surface);padding:8px}\nsvg{display:block;width:100%;height:210px}\n.controls{display:grid;gap:8px}\nlabel{font-size:12px;color:var(--lab-muted)}\ninput{width:100%;accent-color:var(--lab-accent)}\n.actions{display:flex;gap:8px;flex-wrap:wrap}\nbutton{min-height:44px;padding:9px 14px;border:1px solid var(--lab-border);border-radius:999px;background:var(--lab-surface);color:var(--lab-text)}\n#lab-reset{background:var(--lab-accent);color:#fff;border-color:var(--lab-accent)}\n#lab-state,#lab-feedback{margin:0;padding:10px 12px;border-radius:10px;background:var(--lab-surface);font-size:13px;line-height:1.6}\n<\/style>\n<\/head>\n<body>\n<main id=\"lab-root\">\n  <section class=\"chart\" aria-label=\"距离与相对引力的关系图\">\n    <svg viewBox=\"0 0 600 260\" role=\"img\">\n      <line x1=\"52\" y1=\"220\" x2=\"570\" y2=\"220\" stroke=\"var(--lab-border)\"/>\n      <line x1=\"52\" y1=\"24\" x2=\"52\" y2=\"220\" stroke=\"var(--lab-border)\"/>\n      <path id=\"curve\" fill=\"none\" stroke=\"var(--lab-accent)\" stroke-width=\"4\"/>\n      <circle id=\"marker\" cx=\"184\" cy=\"130\" r=\"9\" fill=\"var(--lab-accent-2)\"/>\n      <text x=\"310\" y=\"252\" text-anchor=\"middle\" font-size=\"14\" fill=\"var(--lab-muted)\">距离 r（相对值）<\/text>\n      <text x=\"16\" y=\"124\" transform=\"rotate(-90 16 124)\" text-anchor=\"middle\" font-size=\"14\" fill=\"var(--lab-muted)\">相对引力<\/text>\n    <\/svg>\n  <\/section>\n  <div class=\"controls\">\n    <label for=\"distance\">沿曲线移动距离：<strong id=\"distance-value\">1.0<\/strong> 倍<\/label>\n    <input id=\"distance\" type=\"range\" min=\"1\" max=\"4\" step=\"0.1\" value=\"1\">\n  <\/div>\n  <p id=\"lab-state\" aria-live=\"polite\">当前距离 1.0 倍，相对引力 1.00。<\/p>\n  <p id=\"lab-feedback\" aria-live=\"polite\">查看近处和远处两个位置，比较引力下降的速度。<\/p>\n  <div class=\"actions\"><button id=\"lab-reset\" type=\"button\">回到最近距离<\/button><\/div>\n<\/main>\n<script>\nconst input=document.querySelector('#distance');\nconst curve=document.querySelector('#curve');\nconst marker=document.querySelector('#marker');\nconst seen={near:false,far:false};\nlet complete=false;\nfunction point(r){return {x:52+(r-1)/3*500,y:220-190/(r*r)}}\nfunction buildCurve(){\n  let d='';\n  for(let i=0;i<=80;i++){const r=1+i/20;const p=point(r);d+=(i?' L ':'M ')+p.x+' '+p.y;}\n  curve.setAttribute('d',d);\n}\nfunction publish(){\n  const r=Number(input.value);\n  window.parent.postMessage({source:'deepwhy-lab',type:'state',complete,summary:'距离 '+r.toFixed(1)+' 倍，相对引力 '+(1/(r*r)).toFixed(2),state:{distance:r,relativeForce:1/(r*r)}},'*');\n}\nfunction render(){\n  const r=Number(input.value);const p=point(r);\n  marker.setAttribute('cx',p.x);marker.setAttribute('cy',p.y);\n  document.querySelector('#distance-value').textContent=r.toFixed(1);\n  document.querySelector('#lab-state').textContent='当前距离 '+r.toFixed(1)+' 倍，相对引力 '+(1/(r*r)).toFixed(2)+'。';\n  if(r<=1.2)seen.near=true;if(r>=2)seen.far=true;\n  complete=seen.near&&seen.far;\n  document.querySelector('#lab-feedback').textContent=complete\n    ?'距离变大时，引力下降得比距离本身快得多；距离翻倍时只剩四分之一。'\n    :'继续移动：近处和远处的曲线斜率有什么不同？';\n  publish();\n}\nfunction reset(){input.value='1';seen.near=false;seen.far=false;complete=false;render();}\ninput.addEventListener('input',render);\ndocument.querySelector('#lab-reset').addEventListener('click',reset);\nbuildCurve();render();\n<\/script>\n<\/body>\n<\/html>","height":420,"fallbackText":"距离翻倍时引力降到原来的四分之一；距离越大，下降速度越快。","completionText":"质量越大，吸引越强；距离越大，吸引按平方反比迅速变弱。","reflectionPrompt":"继续用轮椅拉绳的画面，解释加质量与拉远距离为什么会带来不同结果。"}},{"id":"n4","parentId":null,"type":"theory","concept":"弯曲时空","question":"如果地球没有伸出一根绳，苹果为什么还会靠近？","answer":"质量改变周围时空的几何，苹果沿最自然的路径运动。","analogy":"拉绳能说明互相作用，却画不出时空。换到弹性蹦床上：重球压出凹陷，旁边的球沿斜面靠近它。","guide":{"bridge":"前面的拉绳很好用，但它暗示宇宙里真的有一根绳。现在让这个比喻走到边界，改看路径本身。","plainLanguage":"广义相对论不把下落描述成一只隐形手在拉，而是说地球改变了附近时间与空间的几何；苹果只是在沿着自然的轨迹前进。","steps":["把平坦时空想成一张拉紧的蹦床。","放入地球这样的重物，蹦床中心向下凹。","苹果附近的路径因此朝凹陷方向弯曲。","苹果沿这条最自然的路径运动，看起来就像被拉下去。"],"check":{"prompt":"蹦床模型说明了什么，又没有说明什么？","answer":"它能说明质量与路径弯曲的关系，却不是字面意义的二维床面，也不能解释全部时空效应。"}},"status":"complete","sourceIds":["einstein-online-gravity"],"detail":{"deepDive":"广义相对论把引力解释为时空曲率。自由下落的苹果与绕地飞行的卫星，都可以看成在弯曲几何中沿测地线运动。牛顿模型在弱场和低速下仍极其准确。","whyItMatters":"从“力”切换到“几何”不是文字游戏，而是理解水星轨道、引力透镜、时间膨胀和引力波的必要台阶。","experimentOrProof":"Einstein Online 说明广义相对论对时空曲率、非线性相互作用和引力波的描述；它与牛顿模型在适用范围上不同。","frontier":""},"diagram":{"mode":"svg","kind":"comparison","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 780 360\">\n  <rect width=\"780\" height=\"360\" fill=\"#f6f7fc\"/>\n  <rect x=\"35\" y=\"56\" width=\"330\" height=\"246\" rx=\"24\" fill=\"#fff\" stroke=\"#d9dce7\"/>\n  <rect x=\"415\" y=\"56\" width=\"330\" height=\"246\" rx=\"24\" fill=\"#fff\" stroke=\"#d9dce7\"/>\n  <text x=\"200\" y=\"91\" text-anchor=\"middle\" font-family=\"system-ui,sans-serif\" font-size=\"20\" font-weight=\"700\" fill=\"#27324a\">牛顿：因为有力<\/text>\n  <text x=\"580\" y=\"91\" text-anchor=\"middle\" font-family=\"system-ui,sans-serif\" font-size=\"20\" font-weight=\"700\" fill=\"#27324a\">爱因斯坦：因为几何<\/text>\n  <circle cx=\"200\" cy=\"178\" r=\"52\" fill=\"#e7e7ff\" stroke=\"#5b5bd6\" stroke-width=\"4\"/>\n  <circle cx=\"306\" cy=\"178\" r=\"17\" fill=\"#ffe2dd\" stroke=\"#d95c4b\" stroke-width=\"3\"/>\n  <path d=\"M254 178 L284 178\" stroke=\"#d95c4b\" stroke-width=\"4\"/>\n  <path d=\"M284 178 L273 170 L273 186Z\" fill=\"#d95c4b\"/>\n  <text x=\"200\" y=\"273\" text-anchor=\"middle\" font-family=\"system-ui,sans-serif\" font-size=\"16\" fill=\"#737b91\">一条看不见的拉力<\/text>\n  <path d=\"M474 211 Q580 110 696 211\" fill=\"none\" stroke=\"#c8c9ef\" stroke-width=\"3\"/>\n  <path d=\"M468 235 Q580 140 702 235\" fill=\"none\" stroke=\"#aaaef0\" stroke-width=\"3\"/>\n  <path d=\"M470 259 Q580 171 700 259\" fill=\"none\" stroke=\"#8c92eb\" stroke-width=\"3\"/>\n  <circle cx=\"580\" cy=\"218\" r=\"28\" fill=\"#e7e7ff\" stroke=\"#5b5bd6\" stroke-width=\"4\"/>\n  <circle cx=\"659\" cy=\"210\" r=\"12\" fill=\"#ffe2dd\" stroke=\"#d95c4b\" stroke-width=\"3\"/>\n  <path d=\"M612 221 Q628 207 646 210\" fill=\"none\" stroke=\"#d95c4b\" stroke-width=\"3\" stroke-dasharray=\"5 4\"/>\n  <text x=\"580\" y=\"273\" text-anchor=\"middle\" font-family=\"system-ui,sans-serif\" font-size=\"16\" fill=\"#737b91\">质量让路径自然弯向它<\/text>\n  <text x=\"390\" y=\"335\" text-anchor=\"middle\" font-family=\"system-ui,sans-serif\" font-size=\"17\" fill=\"#4d5870\">两种画法都能预测苹果，但解释世界的语言不同<\/text>\n<\/svg>","src":null,"alt":"左侧用相互拉力解释苹果，右侧用弯曲路径解释同一个运动。","caption":"这是两种解释模型的对照，不表示牛顿模型被简单判错。","formula":null,"sourceIds":["openstax-gravity","einstein-online-gravity"],"interaction":{"kind":"toggle","prompt":"切换解释模型，看看同一个苹果运动被怎样描述。","label":"解释模型","onLabel":"弯曲时空","offLabel":"牛顿引力","onFeedback":"苹果沿着被质量改变的时空几何运动，不需要假设一根看不见的绳。","offFeedback":"牛顿模型用一对相互吸引力解释，做日常计算已经足够准确。","initial":false}},"videoIds":["n4-video-1","n4-video-2","n4-video-3","n4-video-4","n4-video-5"],"branches":[{"id":"n4-b1","type":"theory","question":"自由落体的人为什么会感觉失重？","answer":"自由下落时，人和周围物体一起沿相近路径运动，局部没有支持力压在身上。","sourceIds":["einstein-online-gravity"]}],"lab":null},{"id":"n5","parentId":null,"type":"frontier","concept":"涟漪作证","question":"时空弯曲能被直接观测到吗？","answer":"能。剧烈天体运动发出的时空涟漪已被 LIGO 接收到。","analogy":"继续用蹦床：两个人猛烈跳动会让床面波纹向外传，远处的仪器也能感到细微振动。","guide":{"bridge":"弯曲时空若只是漂亮图景，还不够。现在要找一种会在现实中留下信号的后果。","plainLanguage":"大质量天体加速运动时，时空的弯曲会像波纹一样传播。它们到达地球时，会让空间尺度发生极微小变化。","steps":["两个致密天体相互绕转并最终合并。","剧烈变化让时空产生向外传播的波纹。","波纹经过地球时，让不同位置的镜面距离发生极小变化。","LIGO 用激光测量这种变化，并排除其他噪声。"],"check":{"prompt":"为什么引力波探测不能只靠“看到一条波线”？","answer":"真正的证据是仪器对不同地点的微小长度变化与理论波形相互匹配，并排除了其他噪声来源。"}},"status":"complete","sourceIds":["ligo-gw150914","ligo-gravity-waves"],"detail":{"deepDive":"引力波是时空曲率的传播变化。LIGO 使用长基线激光干涉测量极微小的臂长变化；2015 年 GW150914 的探测与双黑洞合并的理论波形相符。","whyItMatters":"它把广义相对论从可计算模型推进到可观测现象，也为检验强场引力提供了新窗口。","experimentOrProof":"LIGO 官方记录 GW150914 于 2015-09-14 观测、2016-02-11 公布，并把它与广义相对论预测的引力波联系起来。","frontier":"引力波观测仍在扩展事件数量和精度；具体探测结果应以合作组发布的数据和论文为准。"},"diagram":{"mode":"svg","kind":"evidence","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 780 330\">\n  <rect width=\"780\" height=\"330\" fill=\"#f6f7fc\"/>\n  <text x=\"390\" y=\"42\" text-anchor=\"middle\" font-family=\"system-ui,sans-serif\" font-size=\"21\" font-weight=\"700\" fill=\"#27324a\">时空涟漪从剧烈运动传到地球<\/text>\n  <path d=\"M80 175 L700 175\" stroke=\"#c8cce0\" stroke-width=\"3\"/>\n  <circle cx=\"165\" cy=\"175\" r=\"25\" fill=\"#e7e7ff\" stroke=\"#5b5bd6\" stroke-width=\"4\"/>\n  <circle cx=\"390\" cy=\"175\" r=\"34\" fill=\"#ffe9d7\" stroke=\"#d88745\" stroke-width=\"4\"/>\n  <circle cx=\"615\" cy=\"175\" r=\"20\" fill=\"#e1f4ed\" stroke=\"#18a77a\" stroke-width=\"4\"/>\n  <text x=\"165\" y=\"225\" text-anchor=\"middle\" font-family=\"system-ui,sans-serif\" font-size=\"17\" fill=\"#4d5870\">两个黑洞靠近<\/text>\n  <text x=\"390\" y=\"235\" text-anchor=\"middle\" font-family=\"system-ui,sans-serif\" font-size=\"17\" fill=\"#4d5870\">合并并扰动时空<\/text>\n  <text x=\"615\" y=\"225\" text-anchor=\"middle\" font-family=\"system-ui,sans-serif\" font-size=\"17\" fill=\"#4d5870\">探测器记录形变<\/text>\n  <path d=\"M195 175 L345 175 M435 175 L585 175\" stroke=\"#8c92eb\" stroke-width=\"4\"/>\n  <path d=\"M345 175 L325 162 L328 188Z M585 175 L565 162 L568 188Z\" fill=\"#8c92eb\"/>\n  <text x=\"390\" y=\"290\" text-anchor=\"middle\" font-family=\"system-ui,sans-serif\" font-size=\"17\" fill=\"#737b91\">LIGO 在 2015 年首次确认探测到引力波<\/text>\n<\/svg>","src":null,"alt":"两个黑洞合并产生向外传播的时空扰动，最终被地球探测器记录。","caption":"证据链把理论预言、天体事件和探测器记录分开显示，不把示意图当成观测原图。","formula":null,"sourceIds":["ligo-gw150914","ligo-gravity-waves"],"interaction":null},"videoIds":["n5-video-1","n5-video-2","n5-video-3","n5-video-4","n5-video-5"],"branches":[],"lab":null},{"id":"n6","parentId":null,"type":"boundary","concept":"极小尺度","question":"这套解释在哪里还不够用？","answer":"在极微小尺度，引力与量子规则还没有统一成完整理论。","analogy":"拉绳和蹦床能解释看得见的对象；当研究对象小到只剩概率云，旧画面就开始失真。","guide":{"bridge":"我们已经从落下走到时空与实验。最后一问不是再加一个公式，而是确认模型在哪里停止可靠。","plainLanguage":"广义相对论擅长描述大尺度引力，量子理论擅长描述微观相互作用。把两者放进同一场景时，现有理论仍会遇到困难。","steps":["把尺度缩小到粒子附近，引力的整体几何图像变得难以直接使用。","量子理论又必须描述离散的交换与概率结果。","现有候选理论尚未形成经实验确认的统一答案。","所以对苹果的解释完整，不等于对万物的解释已经完成。"],"check":{"prompt":"能用拉绳解释苹果落地，是否等于它也能解释量子引力？","answer":"不等于。拉绳只解释了弱场中的相互吸引与质量差，无法承担微观量子描述。"}},"status":"complete","sourceIds":["sep-quantum-gravity"],"detail":{"deepDive":"量子引力研究试图把广义相对论与量子理论放进同一个自洽框架。弦理论、圈量子引力等路线各有不同工具和未解问题，实验检验也极其困难。","whyItMatters":"承认边界能阻止一个有效比喻越界使用，也帮助学习者区分“解释苹果”与“解释万物”的范围。","experimentOrProof":"SEP 的量子引力条目说明，当前尚无完整且经实验确认的量子引力理论。","frontier":"这是一个活跃研究领域；本页不把任何候选理论写成已经完成的答案。"},"diagram":null,"videoIds":["n6-video-1","n6-video-2","n6-video-3","n6-video-4","n6-video-5"],"branches":[{"id":"n6-b1","type":"boundary","question":"为什么不能把蹦床当作时空本身？","answer":"蹦床只是弯曲路径的二维提示，真实时空包含时间维度、非欧几何和不由橡皮膜提供的动力学。","sourceIds":["einstein-online-gravity"]}],"lab":null}],"takeaway":"先用拉绳看见互相作用，再用质量、距离和时空几何扩展它；最后承认模型在极小尺度仍未完成。"},"videos":{"platformsSearched":["youtube","bilibili"],"items":[{"id":"n1-video-1","title":"牛顿如何发现重力学说？苹果砸在头顶上，咬上一口突然开窍","author":"影视新番z","platform":"bilibili","url":"https://www.bilibili.com/video/BV1DY4y177d5","embedUrl":"https://player.bilibili.com/player.html?bvid=BV1DY4y177d5&page=1&high_quality=1&danmaku=0&autoplay=0","thumbnailUrl":"https://i2.hdslb.com/bfs/archive/d5bdd670f2d83337453c14ea26817f50f200c86b.jpg","durationSeconds":78,"publishedAt":"2022-07-15","queryDate":"2026-10-24","metricsStatus":"captured","metrics":{"views":11038,"likes":56,"comments":6},"selectionRationale":"从苹果下落、牛顿故事或重力历史建立可观察现象。","sourceIds":["bili-bv1dy4y177d5"]},{"id":"n1-video-2","title":"重力到底是什么？从亚里士多德到牛顿，10分钟了解重力的历史｜【慢聊科普】大鹏和桃","author":"慢聊科普_大鹏和桃","platform":"bilibi
