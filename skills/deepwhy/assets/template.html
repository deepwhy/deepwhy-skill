      function renderBackgroundTab() {
        const root = byId("background-body");
        root.replaceChildren();
        const tab = state.backgroundTab;
        const contextNode = state.backgroundNodeId
          ? nodeMap.get(state.backgroundNodeId)
          : null;
        const isGlobalVideoLibrary = tab === "videos" && !contextNode;
        byId("background-title").textContent = isGlobalVideoLibrary
          ? "视频资料库"
          : "研究背景";
        byId("background-summary").textContent = isGlobalVideoLibrary
          ? `共 ${data.videos.items.length} 条外站视频，点击封面可前往对应平台。`
          : contextNode
            ? `从「${contextNode.concept}」延伸的背景资料。${data.background.summary}`
            : data.background.summary;
        if (tab === "videos") {
          if (!contextNode) {
            renderGlobalVideoLibrary(root);
            return;
          }
          const videoIds = contextNode.videoIds || [];
          if (!videoIds.length) {
            root.append(el("p", "empty-state", "这个节点没有指定视频。"));
          } else {
            renderVideoExperience(
              root,
              videoIds,
              "background"
            );
          }
          return;
        }
        if (tab === "timeline") {
          renderTimeline(root);
          return;
        }
        if (tab === "frontier") {
          const items = backgroundItemsFor("frontier");
          if (!items.length) root.append(el("p", "empty-state", "未找到可核验的前沿资料。"));
          items.forEach(item => {
            const card = el("article", "background-card");
            const status = el("span", "claim-status", CLAIM_LABELS[item.status]);
            status.dataset.claim = item.status;
            card.append(status, el("h3", "", item.title));
            card.append(el("p", "", `发布：${item.publishedAt} · 路线：${item.route}`));
            card.append(el("p", "", `当前证据：${item.finding}`));
            card.append(el("p", "", `仍未解决：${item.unresolved}`));
            root.append(card);
          });
          if (data.background.gap) root.append(el("p", "gap-list", data.background.gap));
          return;
        }
        if (tab === "sources") {
          if (data.meta.evidenceGaps.length) {
            const gaps = el("div", "gap-list");
            gaps.append(el("strong", "", "证据边界"));
            const list = el("ul", "rubric");
            data.meta.evidenceGaps.forEach(gap => list.append(el("li", "", gap)));
            gaps.append(list);
            root.append(gaps);
          }
          const list = el("ol", "source-list");
          const node = state.backgroundNodeId ? nodeMap.get(state.backgroundNodeId) : null;
          const nodeSources = node ? new Set(node.sourceIds || []) : null;
          const sources = nodeSources
            ? data.sources.filter(source => nodeSources.has(source.id))
            : data.sources;
          sources.forEach(source => {
            const item = el("li", "source-item");
            item.id = `source-${source.id}`;
            item.append(el("h3", "", source.title));
            item.append(el("p", "", `${source.publisher} · ${source.kind}${source.publishedAt ? ` · 发布 ${source.publishedAt}` : ""} · 核验 ${source.accessedAt}`));
            if (source.notes) item.append(el("p", "", source.notes));
            item.append(link(source.url, "打开来源 ↗"));
            list.append(item);
          });
          root.append(list);
          return;
        }
        const items = backgroundItemsFor(tab);
        if (!items.length) {
          root.append(el("p", "empty-state", "这一维度暂无可核验内容。"));
        }
        items.forEach(item => {
          const card = el("article", "background-card");
          if (tab === "people") {
            card.append(el("h3", "", item.name));
            card.append(el("p", "", item.contribution));
            card.append(el("p", "", `协作与背景：${item.context}`));
            card.append(el("p", "", `贡献边界：${item.limits}`));
            card.append(link(item.profileUrl, "可靠人物资料 ↗", "inline-link"));
          } else if (tab === "institutions") {
            card.append(el("h3", "", item.name));
            card.append(el("p", "", item.role));
            card.append(el("p", "", `代表性工作：${item.representativeWork}`));
            card.append(link(item.homepage, "官方主页 ↗", "inline-link"));
          } else {
            card.append(el("h3", "", item.name));
            card.append(el("p", "", item.case));
            card.append(el("p", "", `价值：${item.value}`));
            card.append(el("p", "", `限制：${item.limitations}`));
          }
          root.append(card);
        });
      }

      function renderTimeline(root) {
        const timelineItems = backgroundItemsFor("timeline");
        const controls = el("div", "timeline-controls");
        const types = ["all", ...new Set(timelineItems.map(item => item.eventType))];
        types.forEach(type => {
          const button = el("button", "filter-button", type === "all" ? "全部" : EVENT_LABELS[type] || type);
          button.type = "button";
          button.dataset.timelineFilter = type;
          button.setAttribute("aria-pressed", String(type === state.timelineFilter));
          controls.append(button);
        });
        root.append(controls);
        const list = el("ol", "timeline");
        [...timelineItems]
          .sort((a, b) => a.sortDate.localeCompare(b.sortDate))
          .filter(item => state.timelineFilter === "all" || item.eventType === state.timelineFilter)
          .forEach(item => {
            const li = el("li");
            li.dataset.eventType = item.eventType;
            const button = el("button");
            button.type = "button";
            button.append(
              el("time", "", item.date),
              el("strong", "", item.title)
            );
            const detail = el("div", "timeline-detail");
            detail.append(el("p", "", item.description), el("p", "", `影响：${item.impact}`));
            button.addEventListener("click", () => li.classList.toggle("is-open"));
            li.append(button, detail);
            list.append(li);
          });
        if (!list.childElementCount) root.append(el("p", "empty-state", "这一筛选下没有事件。"));
        else root.append(list);
        controls.addEventListener("click", event => {
          const button = event.target.closest("[data-timeline-filter]");
          if (!button) return;
          state.timelineFilter = button.dataset.timelineFilter;
          renderBackgroundTab();
        });
      }

      function openBackground(tab = "people", focusId = null, nodeId = null) {
        state.backgroundTab = BG_TABS.includes(tab) ? tab : "people";
        const nextNodeId = nodeId && nodeMap.has(nodeId) ? nodeId : null;
        if (state.backgroundNodeId !== nextNodeId) state.timelineFilter = "all";
        state.backgroundNodeId = nextNodeId;
        document.querySelectorAll("[data-background-tab]").forEach(button => {
          button.setAttribute("aria-selected", String(button.dataset.backgroundTab === state.backgroundTab));
        });
        byId("background-dialog").dataset.nodeId = state.backgroundNodeId || "";
        renderBackgroundTab();
        const dialog = byId("background-dialog");
        if (!dialog.open) {
          if (typeof dialog.showModal === "function") dialog.showModal();
          else dialog.setAttribute("open", "");
        }
        if (focusId) {
          requestAnimationFrame(() => document.getElementById(focusId)?.scrollIntoView({ block: "center" }));
        }
      }

      function closeBackground() {
        const dialog = byId("background-dialog");
        if (typeof dialog.close === "function") dialog.close();
        else dialog.removeAttribute("open");
      }

      function setupExport() {
        byId("export-data").addEventListener("click", () => {
          const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json;charset=utf-8" });
          const url = URL.createObjectURL(blob);
          const anchor = document.createElement("a");
          anchor.href = url;
          anchor.download = `${data.meta.slug}.json`;
          document.body.append(anchor);
          anchor.click();
          anchor.remove();
          setTimeout(() => URL.revokeObjectURL(url), 1000);
          showToast("内容 JSON 已导出。");
        });
      }

      let toastTimer;
      function showToast(message) {
        const toast = byId("toast");
        toast.textContent = message;
        toast.classList.add("is-visible");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove("is-visible"), 2200);
      }

      function setupEvents() {
        document.querySelectorAll(".tab-button").forEach(button => {
          button.addEventListener("click", () => {
            state.globalView = null;
            state.tab = button.dataset.tab;
            renderInspector();
          });
        });
        document.querySelectorAll("[data-background-tab]").forEach(button => {
          button.addEventListener("click", () => {
            state.backgroundTab = button.dataset.backgroundTab;
            document.querySelectorAll("[data-background-tab]").forEach(tab => {
              tab.setAttribute("aria-selected", String(tab === button));
            });
            renderBackgroundTab();
          });
        });
        byId("prev-node").addEventListener("click", () => {
          const index = data.chain.nodes.findIndex(node => node.id === state.selectedNodeId);
          if (index > 0) selectNode(data.chain.nodes[index - 1].id);
        });
        byId("next-node").addEventListener("click", () => {
          const index = data.chain.nodes.findIndex(node => node.id === state.selectedNodeId);
          if (index < data.chain.nodes.length - 1) selectNode(data.chain.nodes[index + 1].id);
        });
        byId("hero-next-action").addEventListener("click", () => {
          const index = data.chain.nodes.findIndex(node => node.id === state.selectedNodeId);
          const nextNode = data.chain.nodes[index + 1];
          if (nextNode) selectNode(nextNode.id);
          else {
            state.globalView = null;
            state.quizScope = "node";
            state.quizIndex = 0;
            state.tab = "quiz";
            renderInspector();
            openInspector();
          }
        });
        document.querySelectorAll("[data-global-view]").forEach(button => {
          button.addEventListener("click", () => {
            setGlobalView(button.dataset.globalView);
          });
        });
        byId("background-close").addEventListener("click", closeBackground);
        byId("inspector-close").addEventListener("click", closeInspector);
        byId("background-dialog").addEventListener("click", event => {
          if (event.target === byId("background-dialog")) closeBackground();
        });
        document.addEventListener("keydown", event => {
          if (event.key === "Escape" && document.querySelector(".lab-shell.is-expanded")) {
            closeExpandedLab();
            return;
          }
          if (event.key === "Escape" && byId("inspector").classList.contains("is-open")) {
            closeInspector();
            return;
          }
          const dialog = byId("background-dialog");
          if (dialog.open) return;
          const tag = event.target.tagName;
          if (["INPUT", "TEXTAREA", "SELECT", "BUTTON", "A"].includes(tag)) return;
          const index = data.chain.nodes.findIndex(node => node.id === state.selectedNodeId);
          if (event.key === "ArrowLeft" && index > 0) selectNode(data.chain.nodes[index - 1].id);
          if (event.key === "ArrowRight" && index < data.chain.nodes.length - 1) selectNode(data.chain.nodes[index + 1].id);
        });
      }

      function initialSelection() {
        const hash = decodeURIComponent(window.location.hash.replace(/^#/, ""));
        if (hash === "videos") {
          state.backgroundOnLoad = "videos";
        } else if (hash.startsWith("branch-")) {
          const branch = branchMap.get(hash.slice(7));
          if (branch) {
            state.selectedNodeId = branch.parentId;
            state.selectedBranchId = branch.id;
            state.openBranchNodeId = branch.parentId;
            scrollToInitialNode = true;
          }
        } else if (hash.startsWith("node-")) {
          const node = nodeMap.get(hash.slice(5));
          if (node) {
            state.selectedNodeId = node.id;
            scrollToInitialNode = true;
          }
        }
      }

      window.addEventListener("message", handleLabMessage);
      renderHero();
      initialSelection();
      renderChain();
      updateProgress();
      renderInspector();
      if (scrollToInitialNode) {
        requestAnimationFrame(() => {
          document.querySelector(`.chain-row[data-node-id="${state.selectedNodeId}"]`)?.scrollIntoView({ block: "center" });
        });
      }
      setupEvents();
      setupExport();
      if (state.backgroundOnLoad) openBackground(state.backgroundOnLoad);
      if (window.innerWidth <= 880) closeInspector();
    })();
  </script>
</body>
</html>
